<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Cropper &amp; Rotator</title>
  <script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .container { max-width: 900px; }
    .drop-zone { position: relative; }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .stage {
      margin-top: 1.25rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex; justify-content: center;
      overflow: auto;
    }
    .stage canvas {
      max-width: 100%;
      height: auto;
      display: block;
      background: #fff;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      margin-top: 1rem;
    }
    .toolbar .btn { padding: .45rem .8rem; font-size: .9rem; }
    .toolbar .group { display: flex; align-items: center; gap: .35rem; }
    .toolbar .group label {
      font-size: .8rem; color: var(--text-muted);
    }
    .toolbar .group input[type="number"] {
      width: 4.5rem; padding: .35rem .5rem;
      font-family: monospace; font-size: .85rem;
    }
    .toolbar .sep { width: 1px; align-self: stretch; background: var(--border); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Image Cropper &amp; Rotator</h1>
    <a href="/">&larr; all tools</a>
  </header>

  <main>
    <p class="desc">Crop and rotate images locally — nothing leaves your browser.</p>

    <div class="drop-zone" id="dropZone">
      <p>Drop an image here or click to browse</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="stage" id="stage" hidden>
      <canvas id="canvas" hidden></canvas>
    </div>

    <div class="toolbar" id="toolbar" hidden>
      <button class="btn btn-secondary" id="rotateCcwBtn" type="button" title="Rotate 90° counter-clockwise">&#x21BA; 90° CCW</button>
      <button class="btn btn-secondary" id="rotateCwBtn" type="button" title="Rotate 90° clockwise">&#x21BB; 90° CW</button>
      <span class="sep"></span>
      <div class="group">
        <label for="cropX">X</label><input type="number" id="cropX" min="0" value="0">
        <label for="cropY">Y</label><input type="number" id="cropY" min="0" value="0">
        <label for="cropW">W</label><input type="number" id="cropW" min="1" value="0">
        <label for="cropH">H</label><input type="number" id="cropH" min="1" value="0">
      </div>
      <button class="btn btn-secondary" id="applyCropBtn" type="button">Apply crop</button>
      <span class="sep"></span>
      <button class="btn btn-primary" id="downloadBtn" type="button">Download PNG</button>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fileInput = $('fileInput');
const dropZone = $('dropZone');
const stage = $('stage');
const canvas = $('canvas');
const toolbar = $('toolbar');
const rotateCwBtn = $('rotateCwBtn');
const rotateCcwBtn = $('rotateCcwBtn');
const cropX = $('cropX');
const cropY = $('cropY');
const cropW = $('cropW');
const cropH = $('cropH');
const applyCropBtn = $('applyCropBtn');

let sourceImage = null;

function syncCropFieldDefaults() {
  cropX.value = '0';
  cropY.value = '0';
  cropW.value = String(canvas.width);
  cropH.value = String(canvas.height);
  cropX.max = String(Math.max(0, canvas.width - 1));
  cropY.max = String(Math.max(0, canvas.height - 1));
  cropW.max = String(canvas.width);
  cropH.max = String(canvas.height);
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) {
      reject(new Error('not an image'));
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}

function drawSource() {
  if (!sourceImage) return;
  canvas.width = sourceImage.naturalWidth;
  canvas.height = sourceImage.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(sourceImage, 0, 0);
}

async function handleFile(file) {
  try {
    sourceImage = await loadImage(file);
  } catch {
    return;
  }
  drawSource();
  dropZone.hidden = true;
  stage.hidden = false;
  canvas.hidden = false;
  toolbar.hidden = false;
  syncCropFieldDefaults();
}

// Rotate the current canvas in place by ±90°. We render the existing
// pixels onto a temp canvas with a transform so each rotation composes
// with whatever the user has already applied (multiple rotations, future
// crops, etc.).
function rotateCanvas(quarterTurnsCw) {
  const turns = ((quarterTurnsCw % 4) + 4) % 4;
  if (turns === 0) return;
  const src = document.createElement('canvas');
  src.width = canvas.width;
  src.height = canvas.height;
  src.getContext('2d').drawImage(canvas, 0, 0);

  const swap = turns % 2 === 1;
  const newW = swap ? src.height : src.width;
  const newH = swap ? src.width : src.height;
  canvas.width = newW;
  canvas.height = newH;

  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.translate(newW / 2, newH / 2);
  ctx.rotate((turns * Math.PI) / 2);
  ctx.drawImage(src, -src.width / 2, -src.height / 2);
  ctx.restore();
}

rotateCwBtn.addEventListener('click', () => {
  rotateCanvas(1);
  syncCropFieldDefaults();
});
rotateCcwBtn.addEventListener('click', () => {
  rotateCanvas(-1);
  syncCropFieldDefaults();
});

// Crop the canvas in place to the rectangle described by the X/Y/W/H
// inputs. Values are clamped to the current canvas bounds so the user
// can't accidentally reach for pixels that don't exist.
function applyCrop() {
  const W = canvas.width;
  const H = canvas.height;
  const x = Math.max(0, Math.min(W - 1, parseInt(cropX.value, 10) || 0));
  const y = Math.max(0, Math.min(H - 1, parseInt(cropY.value, 10) || 0));
  const w = Math.max(1, Math.min(W - x, parseInt(cropW.value, 10) || 0));
  const h = Math.max(1, Math.min(H - y, parseInt(cropH.value, 10) || 0));

  const src = document.createElement('canvas');
  src.width = W;
  src.height = H;
  src.getContext('2d').drawImage(canvas, 0, 0);

  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(src, x, y, w, h, 0, 0, w, h);

  syncCropFieldDefaults();
}

applyCropBtn.addEventListener('click', applyCrop);

function download() {
  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cropped.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

document.getElementById('downloadBtn').addEventListener('click', download);

fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) handleFile(f);
});

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
</script>
</body>
</html>
