<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deload Calculator</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  [data-theme="light"] {
    --deload-green: #16a34a;
    --deload-red: #dc2626;
    --deload-accent: #b8960a;
    --deload-accent-dim: rgba(184, 150, 10, 0.08);
  }
  [data-theme="dark"] {
    --deload-green: #34d399;
    --deload-red: #f87171;
    --deload-accent: #e8c44a;
    --deload-accent-dim: rgba(232, 196, 74, 0.12);
  }

  .container {
    max-width: 400px;
  }

  .inputs {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }

  .field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0.5rem 0.6rem 0;
  }

  .field input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 0.25rem 0.6rem 0.5rem;
    width: 100%;
    outline: none;
    text-align: center;
    -moz-appearance: textfield;
  }
  .field input::-webkit-inner-spin-button,
  .field input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .field input:focus { background: var(--deload-accent-dim); }

  .output {
    margin-top: 1.5rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: none;
  }

  .output.visible { display: block; }

  .output-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--deload-green);
    margin-bottom: 0.75rem;
  }

  .prescription {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 0.75rem;
  }

  .rx-item { text-align: center; }

  .rx-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
  }

  .rx-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .rx-delta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--deload-red);
    margin-top: 0.15rem;
  }

  .volume-line {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    padding-top: 0.6rem;
    border-top: 1px solid var(--border);
  }
  .volume-line strong { color: var(--text); }

  .note {
    margin-top: 1.5rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Deload Calculator</h1>
    <a href="/">← all tools</a>
  </header>
  <p class="desc">Half the volume, keep the weight.</p>

  <div class="inputs">
    <div class="field">
      <label>Sets</label>
      <input type="number" id="sets" min="1" max="20" value="3" oninput="calc()">
    </div>
    <div class="field">
      <label>Reps</label>
      <input type="number" id="reps" min="1" max="30" value="8" oninput="calc()">
    </div>
    <div class="field">
      <label>kg</label>
      <input type="number" id="weight" min="0" step="2.5" value="80" oninput="calc()">
    </div>
  </div>

  <div class="output" id="output">
    <div class="output-label">▸ Deload</div>
    <div class="prescription">
      <div class="rx-item">
        <div class="rx-value" id="rx-sets"></div>
        <div class="rx-unit">sets</div>
        <div class="rx-delta" id="delta-sets"></div>
      </div>
      <div class="rx-item">
        <div class="rx-value" id="rx-reps"></div>
        <div class="rx-unit">reps</div>
        <div class="rx-delta" id="delta-reps"></div>
      </div>
      <div class="rx-item">
        <div class="rx-value" id="rx-weight"></div>
        <div class="rx-unit">kg</div>
        <div class="rx-delta" id="delta-weight"></div>
      </div>
    </div>
    <div class="volume-line" id="vol-line"></div>
  </div>

  <div class="note">
    Sets halved (round up). Reps −2. Weight unchanged. No sets near failure.
  </div>
</div>

<script>
  function calc() {
    const sets = parseInt(document.getElementById('sets').value);
    const reps = parseInt(document.getElementById('reps').value);
    const weight = parseInt(document.getElementById('weight').value);

    if (!sets || !reps || !weight) {
      document.getElementById('output').classList.remove('visible');
      return;
    }

    const dSets = Math.max(1, Math.ceil(sets / 2));
    const dReps = Math.max(1, reps - 2);
    const dWeight = weight;

    const workVol = sets * reps * weight;
    const deloadVol = dSets * dReps * dWeight;
    const reduction = Math.round((1 - deloadVol / workVol) * 100);

    document.getElementById('rx-sets').textContent = dSets;
    document.getElementById('rx-reps').textContent = dReps;
    document.getElementById('rx-weight').textContent = dWeight;

    const sd = dSets - sets;
    const rd = dReps - reps;
    document.getElementById('delta-sets').textContent = sd !== 0 ? sd : '';
    document.getElementById('delta-reps').textContent = rd !== 0 ? rd : '';
    document.getElementById('delta-weight').textContent = '';

    document.getElementById('vol-line').innerHTML = 'Volume: <strong>−' + reduction + '%</strong>';
    document.getElementById('output').classList.add('visible');
  }

  calc();
</script>
</body>
</html>
