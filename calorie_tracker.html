<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Log</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  [data-theme="light"] {
    --cal-accent: #b8960a;
    --cal-accent-dim: rgba(184, 150, 10, 0.07);
    --protein: #059669;
    --protein-dim: rgba(5, 150, 105, 0.08);
    --warn: #dc2626;
    --warn-dim: rgba(220, 38, 38, 0.08);
    --cal-blue: #2563eb;
    --cal-blue-dim: rgba(37, 99, 235, 0.08);
    --carbs: #d97706;
    --fat: #7c3aed;
  }
  [data-theme="dark"] {
    --cal-accent: #c8ff00;
    --cal-accent-dim: rgba(200, 255, 0, 0.07);
    --protein: #34d399;
    --protein-dim: rgba(52, 211, 153, 0.08);
    --warn: #f87171;
    --warn-dim: rgba(248, 113, 113, 0.08);
    --cal-blue: #60a5fa;
    --cal-blue-dim: rgba(96, 165, 250, 0.08);
    --carbs: #fbbf24;
    --fat: #c084fc;
  }

  .app { max-width: 660px; margin: 0 auto; padding: 48px 20px 120px; }

  /* ── HEADER ── */
  header { margin-bottom: 36px; }
  .title-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  .title-row h1 {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300; font-size: 12px;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--text-muted);
  }
  .title-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cal-accent);
  }

  .totals {
    display: flex; gap: 24px; align-items: baseline;
    padding: 20px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tot { display: flex; align-items: baseline; gap: 7px; }
  .tot-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px; font-weight: 400;
    letter-spacing: -1.5px;
    transition: all 0.3s ease;
  }
  .tot-val.cal { color: var(--cal-accent); }
  .tot-val.pro { color: var(--protein); }
  .tot-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 1.5px; text-transform: uppercase;
  }

  /* ── INPUT ZONE ── */
  .input-zone { margin: 28px 0; }
  .input-wrap { position: relative; }
  .input-zone textarea {
    width: 100%; background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 52px 14px 16px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; line-height: 1.8;
    resize: vertical; min-height: 96px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-zone textarea:focus { border-color: var(--border-hover); }
  .input-zone textarea::placeholder { color: var(--text-muted); font-style: italic; }

  /* Camera button inside textarea */
  .btn-cam {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    color: var(--text-muted);
  }
  .btn-cam:hover { border-color: var(--cal-blue); color: var(--cal-blue); }
  .btn-cam svg { width: 18px; height: 18px; }
  #photoInput { display: none; }

  .input-foot {
    display: flex; justify-content: space-between;
    align-items: center; margin-top: 10px;
  }
  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--text-muted);
    letter-spacing: 0.3px;
  }
  .btn-log {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: 2.5px; text-transform: uppercase;
    background: var(--cal-accent); color: #000;
    border: none; padding: 9px 26px;
    border-radius: 3px; cursor: pointer;
    transition: all 0.15s;
  }
  .btn-log:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-log:active { transform: translateY(0); }
  .btn-log:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }

  .error-bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px; color: var(--warn);
    background: var(--warn-dim);
    padding: 9px 14px; border-radius: 4px;
    margin-top: 8px; display: none;
    line-height: 1.5;
  }

  /* ── CLIP RESULTS PANEL ── */
  .clip-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-top: 10px;
    overflow: hidden;
    display: none;
    animation: slideIn 0.22s ease-out;
  }
  .clip-panel.active { display: block; }

  .clip-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .clip-header-left { display: flex; align-items: center; gap: 8px; }
  .clip-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--cal-blue);
  }
  .clip-model-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .btn-clip-close {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 14px; padding: 2px 4px;
    transition: color 0.15s;
  }
  .btn-clip-close:hover { color: var(--warn); }

  .clip-preview {
    display: flex; gap: 14px; padding: 12px 14px;
    align-items: flex-start;
  }
  .clip-thumb {
    width: 80px; height: 80px; border-radius: 4px;
    object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .clip-matches { flex: 1; display: flex; flex-direction: column; gap: 4px; }

  .clip-match {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
    border: 1px solid transparent;
    flex-wrap: wrap;
  }
  .clip-match:hover { background: var(--cal-accent-dim); border-color: var(--border); }
  .clip-match.selected { background: var(--cal-accent-dim); border-color: var(--cal-accent); }

  .clip-match-top {
    display: flex; align-items: center; gap: 6px; width: 100%;
  }
  .clip-match-name { font-size: 13px; color: var(--text); flex: 1; }
  .clip-match-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    flex-shrink: 0;
  }
  .clip-match-controls {
    display: flex; align-items: center; gap: 5px;
    width: 100%; padding-left: 22px;
  }
  .clip-size-btns { display: flex; gap: 2px; }
  .clip-size-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: none; color: var(--text-muted);
    cursor: pointer; transition: all 0.12s;
  }
  .clip-size-btn:hover { border-color: var(--text); color: var(--text); }
  .clip-size-btn.active { border-color: var(--cal-accent); color: var(--cal-accent); background: var(--cal-accent-dim); }
  .clip-qty-input {
    width: 48px; padding: 2px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--cal-accent);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; text-align: right;
    outline: none;
    -moz-appearance: textfield;
  }
  .clip-qty-input::-webkit-inner-spin-button,
  .clip-qty-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .clip-qty-input:focus { border-color: var(--cal-accent); }
  .clip-qty-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-muted);
  }
  .clip-portion-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-muted);
    margin-left: auto;
    white-space: nowrap;
  }
  .clip-match-check {
    width: 14px; height: 14px; border-radius: 3px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--cal-accent);
    flex-shrink: 0;
  }
  .clip-match.selected .clip-match-check {
    border-color: var(--cal-accent);
    background: var(--cal-accent-dim);
  }

  .clip-actions {
    padding: 8px 14px 12px;
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .btn-clip-add {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase;
    background: var(--cal-accent); color: #000;
    border: none; padding: 7px 18px;
    border-radius: 3px; cursor: pointer;
    transition: all 0.15s;
  }
  .btn-clip-add:hover { opacity: 0.85; }
  .btn-clip-add:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ── CLIP LOADING STATE ── */
  .clip-loading {
    padding: 16px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .clip-loading .spin {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--cal-blue);
    border-radius: 50%;
    animation: sp 0.6s linear infinite;
  }
  .clip-loading span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px; color: var(--text-muted);
  }

  .clip-progress { padding: 0 14px 12px; }
  .clip-progress-bar {
    height: 3px; background: var(--border); border-radius: 2px;
    overflow: hidden;
  }
  .clip-progress-fill {
    height: 100%; background: var(--cal-blue);
    border-radius: 2px; transition: width 0.3s;
    width: 0%;
  }

  /* ── ENTRIES ── */
  .sec-head {
    display: flex; justify-content: space-between;
    align-items: center; margin: 36px 0 12px;
  }
  .sec-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--text-muted);
  }
  .btn-clear {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-muted);
    background: none; border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 3px;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-clear:hover { border-color: var(--warn); color: var(--warn); }

  .entries { display: flex; flex-direction: column; gap: 5px; }

  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 13px 16px;
    animation: slideIn 0.22s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 8px;
  }
  .entry-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--text-muted);
  }
  .btn-rm {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 15px; line-height: 1;
    padding: 2px 4px; opacity: 0; transition: all 0.15s;
  }
  .entry:hover .btn-rm { opacity: 1; }
  .btn-rm:hover { color: var(--warn); }

  .entry-rows { display: flex; flex-direction: column; gap: 4px; }
  .erow {
    display: flex; justify-content: space-between;
    align-items: baseline; gap: 12px; padding: 2px 0;
  }
  .erow-name {
    font-size: 13.5px; color: var(--text);
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .erow-match {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-muted);
    max-width: 180px; min-width: 0;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; text-align: center;
  }
  .erow-macros { display: flex; gap: 10px; flex-shrink: 0; }
  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; white-space: nowrap;
  }
  .pill.c { color: var(--cal-accent); }
  .pill.p { color: var(--protein); }
  .pill.cb { color: var(--carbs); }
  .pill.f { color: var(--fat); }

  .entry-foot {
    margin-top: 8px; padding-top: 7px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 18px;
  }
  .entry-foot .pill { font-weight: 500; font-size: 12.5px; }

  .loading {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px; margin-bottom: 5px;
  }
  .spin {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--cal-accent);
    border-radius: 50%;
    animation: sp 0.6s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .loading span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px; color: var(--text-muted);
  }

  .empty {
    text-align: center; padding: 52px 20px;
    color: var(--text-muted);
  }
  .empty .ico { font-size: 24px; margin-bottom: 14px; opacity: 0.35; }
  .empty p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px; line-height: 2; letter-spacing: 0.3px;
  }

  @media (max-width: 500px) {
    .totals { gap: 24px; }
    .tot-val { font-size: 28px; }
    .erow-match { display: none; }
  }
</style>
</head>

<div class="app">

  <header>
    <div class="title-row">
      <div class="title-dot"></div>
      <h1>Fuel Log</h1>
    </div>
    <a href="/">← all tools</a>
    <div class="totals">
      <div class="tot">
        <span class="tot-val cal" id="tCal">0</span>

      </div>
      <div class="tot">
        <span class="tot-val pro" id="tPro">0</span>
        <span class="tot-unit">g pro</span>
      </div>
      <div class="tot">
        <span class="tot-val" style="color:var(--carbs)" id="tCarb">0</span>
        <span class="tot-unit">g carb</span>
      </div>
      <div class="tot">
        <span class="tot-val" style="color:var(--fat)" id="tFat">0</span>
        <span class="tot-unit">g fat</span>
      </div>
    </div>
  </header>

  <div class="input-zone">
    <div class="input-wrap">
      <textarea id="inp" placeholder="200g chicken breast&#10;1 cup white rice&#10;2 eggs&#10;a scoop of whey protein"></textarea>
      <button class="btn-cam" onclick="document.getElementById('photoInput').click()" title="Snap or upload a food photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhoto(this)">
    </div>

    <div id="clipPanel" class="clip-panel"></div>
    <div class="error-bar" id="err"></div>

    <div class="input-foot">
      <span class="hint">text or photo · ctrl+enter to log</span>
      <button class="btn-log" id="logBtn" onclick="doLog()">Log</button>
    </div>
  </div>

  <div class="sec-head" id="secHead" style="display:none">
    <span class="sec-label">Entries</span>
    <button class="btn-clear" onclick="clearAll()">Clear day</button>
  </div>
  <div id="loadZone"></div>
  <div class="entries" id="entries"></div>
  <div class="empty" id="empty">
    <div class="ico">&#9671;</div>
    <p>Type what you ate or snap a photo.<br>Quantities, brands, rough guesses — all fine.<br>USDA primary · offline cache · CLIP vision.</p>
  </div>

</div>

<script type="module">
// ═══════════════════════════════════════════════════
// TRANSFORMERS.JS — lazy loaded on first photo
// ═══════════════════════════════════════════════════
let pipeline = null;
let clipClassifier = null;
let modelLoading = false;

async function loadCLIP(progressCb) {
  if (clipClassifier) return clipClassifier;
  if (modelLoading) return null;
  modelLoading = true;

  try {
    const { pipeline: createPipeline, env } = await import(
      'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.1'
    );
    // Use wasm backend, cache models in browser
    env.allowLocalModels = false;

    progressCb('Loading CLIP model (~90MB)…', 10);

    clipClassifier = await createPipeline(
      'zero-shot-image-classification',
      'Xenova/clip-vit-base-patch16',
      {
        progress_callback: (p) => {
          if (p.status === 'progress' && p.total) {
            const pct = Math.round((p.loaded / p.total) * 100);
            progressCb(`Downloading: ${pct}%`, pct);
          } else if (p.status === 'ready') {
            progressCb('Model ready', 100);
          }
        }
      }
    );

    modelLoading = false;
    return clipClassifier;
  } catch (err) {
    modelLoading = false;
    throw err;
  }
}

// ═══════════════════════════════════════════
// FUZZY MATCH
// ═══════════════════════════════════════════
function fuzzyMatch(query) {
  const q = query.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  if (DB[q]) return { key:q, data:DB[q] };
  const qWords = q.split(/\s+/);
  let best = null, bestScore = 0;
  for (const key of Object.keys(DB)) {
    const kWords = key.split(/\s+/);
    let score = 0;
    if (q.includes(key)) score += 10 + key.length;
    if (key.includes(q)) score += 8 + q.length;
    for (const kw of kWords) {
      for (const qw of qWords) {
        if (qw === kw) score += 5;
        else if (qw.length > 3 && kw.length > 3 && (qw.includes(kw) || kw.includes(qw))) score += 3;
      }
    }
    if (score > bestScore) { bestScore = score; best = { key, data:DB[key] }; }
  }
  return bestScore >= 3 ? best : null;
}

// ═══════════════════════════════════════════
// TEXT PARSER
// ═══════════════════════════════════════════
function parseLine(raw) {
  let line = raw.trim();
  if (!line) return null;
  const unitKeys = Object.keys(UNIT_G).sort((a,b) => b.length - a.length);
  const unitPat = unitKeys.join('|');

  const re1 = new RegExp(`^(\\d+\\.?\\d*)\\s*(${unitPat})?\\s*(?:of\\s+)?(.+)$`,'i');
  let m = line.match(re1);
  if (m) {
    const qty = parseFloat(m[1]);
    const unit = (m[2] || '').toLowerCase();
    const food = m[3].trim();
    let grams;
    if (unit && UNIT_G[unit]) { grams = qty * UNIT_G[unit]; }
    else { const pw = findPieceWeight(food); grams = pw ? qty * pw : qty; }
    return { qty, unit: unit || 'g', grams, food, original:line };
  }

  const wordNums = {a:1,an:1,one:1,single:1,two:2,three:3,four:4,five:5,six:6,half:0.5};
  const wordPat = Object.keys(wordNums).join('|');
  const re2 = new RegExp(`^(${wordPat})\\s+(${unitPat})?\\s*(?:of\\s+)?(.+)$`,'i');
  m = line.match(re2);
  if (m) {
    const qty = wordNums[m[1].toLowerCase()] || 1;
    const unit = (m[2] || '').toLowerCase();
    const food = m[3].trim();
    let grams;
    if (unit && UNIT_G[unit]) { grams = qty * UNIT_G[unit]; }
    else { const pw = findPieceWeight(food); grams = pw ? qty * pw : qty * 100; }
    return { qty, unit: unit || 'pc', grams, food, original:line };
  }

  const re3 = new RegExp(`^(.+?)\\s+(\\d+\\.?\\d*)\\s*(${unitPat})?\\s*$`,'i');
  m = line.match(re3);
  if (m) {
    const food = m[1].trim();
    const qty = parseFloat(m[2]);
    const unit = (m[3] || '').toLowerCase();
    let grams;
    if (unit && UNIT_G[unit]) { grams = qty * UNIT_G[unit]; }
    else { const pw = findPieceWeight(food); grams = pw ? qty * pw : qty; }
    return { qty, unit: unit || 'g', grams, food, original:line };
  }

  return { qty:1, unit:'serving', grams:100, food:line, original:line };
}

function findPieceWeight(food) {
  const f = food.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  if (PIECE_WEIGHTS[f]) return PIECE_WEIGHTS[f];
  for (const [k,v] of Object.entries(PIECE_WEIGHTS)) {
    if (f.includes(k) || k.includes(f)) return v;
  }
  return null;
}

async function usdaSearch(query) {
  try {
    const url = `${API_BASE}?query=${encodeURIComponent(query)}&pageSize=5&dataType=Foundation,SR%20Legacy&api_key=${API_KEY}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) return null;
    const data = await res.json();
    const foods = data.foods || [];
    if (!foods.length) return null;
    const f = foods[0];
    const cal = (f.foodNutrients || []).find(n => n.nutrientId === 1008);
    const pro = (f.foodNutrients || []).find(n => n.nutrientId === 1003);
    const carb = (f.foodNutrients || []).find(n => n.nutrientId === 1005);
    const fat = (f.foodNutrients || []).find(n => n.nutrientId === 1004);
    return { name: f.description || query,
      calPer100: cal ? cal.value : 0, proPer100: pro ? pro.value : 0,
      carbPer100: carb ? carb.value : 0, fatPer100: fat ? fat.value : 0 };
  } catch { return null; }
}

// ═══════════════════════════════════════════
// LOOKUP
// ═══════════════════════════════════════════
async function lookupItem(parsed) {
  const usda = await usdaSearch(parsed.food);
  if (usda) {
    const scale = parsed.grams / 100;
    return { name: parsed.original, match: '⬡ ' + usda.name.toLowerCase(),
      calories: Math.round(usda.calPer100 * scale),
      protein: Math.round(usda.proPer100 * scale * 2) / 2,
      carbs: Math.round(usda.carbPer100 * scale * 2) / 2,
      fat: Math.round(usda.fatPer100 * scale * 2) / 2 };
  }
  const match = fuzzyMatch(parsed.food);
  if (match) {
    const [calPer100, proPer100, carbPer100, fatPer100] = match.data;
    const scale = parsed.grams / 100;
    return { name: parsed.original, match: '⊙ ' + match.key,
      calories: Math.round(calPer100 * scale),
      protein: Math.round(proPer100 * scale * 2) / 2,
      carbs: Math.round(carbPer100 * scale * 2) / 2,
      fat: Math.round(fatPer100 * scale * 2) / 2 };
  }
  return { name: parsed.original, match: '⚠ not found', calories: 0, protein: 0, carbs: 0, fat: 0 };
}

// ═══════════════════════════════════════════
// PHOTO HANDLING + CLIP
// ═══════════════════════════════════════════
let clipSelectedItems = new Map();
let clipResults = [];
let clipImageUrl = null;

async function handlePhoto(input) {
  const file = input.files?.[0];
  if (!file) return;
  input.value = '';

  const panel = $('clipPanel');
  panel.classList.add('active');
  clipSelectedItems = new Map();
  clipResults = [];

  clipImageUrl = URL.createObjectURL(file);

  panel.innerHTML = `
    <div class="clip-header">
      <div class="clip-header-left">
        <span class="clip-title">CLIP Vision</span>
        <span class="clip-model-status" id="clipStatus">initializing…</span>
      </div>
      <button class="btn-clip-close" onclick="closeClip()">&#10005;</button>
    </div>
    <div class="clip-loading">
      <div class="spin"></div>
      <span id="clipLoadMsg">Loading model…</span>
    </div>
    <div class="clip-progress"><div class="clip-progress-bar"><div class="clip-progress-fill" id="clipBar"></div></div></div>
  `;

  try {
    const classifier = await loadCLIP((msg, pct) => {
      const loadMsg = $('clipLoadMsg');
      const bar = $('clipBar');
      if (loadMsg) loadMsg.textContent = msg;
      if (bar) bar.style.width = pct + '%';
    });

    if (!classifier) {
      panel.innerHTML = `<div style="padding:14px;color:var(--warn);font-family:'JetBrains Mono',monospace;font-size:12px;">Model is already loading, try again in a moment.</div>`;
      return;
    }

    const status = $('clipStatus');
    if (status) status.textContent = 'classifying…';
    const loadMsg = $('clipLoadMsg');
    if (loadMsg) loadMsg.textContent = 'Analyzing image…';

    const results = await classifier(clipImageUrl, CLIP_LABELS, {
      hypothesis_template: '{}'
    });

    clipResults = results
      .map((r, i) => ({
        label: CLIP_LABEL_MAP[CLIP_LABELS.indexOf(r.label)],
        score: r.score,
      }))
      .filter(r => r.label)
      .sort((a,b) => b.score - a.score)
      .slice(0, 8);

    if (clipResults.length) {
      const lbl = clipResults[0].label;
      clipSelectedItems.set(lbl, { qty: getTypicalServing(lbl), unit: 'g', size: 'M' });
    }

    renderClipResults();

  } catch (err) {
    panel.innerHTML = `
      <div class="clip-header">
        <div class="clip-header-left"><span class="clip-title">CLIP Vision</span></div>
        <button class="btn-clip-close" onclick="closeClip()">&#10005;</button>
      </div>
      <div style="padding:14px;color:var(--warn);font-family:'JetBrains Mono',monospace;font-size:12px;">
        Failed to load model: ${esc(err.message)}<br>
        <span style="color:var(--text-muted);">Needs ~90MB download on first use. Check network/CORS.</span>
      </div>`;
  }
}

function renderClipResults() {
  const panel = $('clipPanel');
  panel.innerHTML = `
    <div class="clip-header">
      <div class="clip-header-left">
        <span class="clip-title">CLIP Vision</span>
        <span class="clip-model-status">top matches</span>
      </div>
      <button class="btn-clip-close" onclick="closeClip()">&#10005;</button>
    </div>
    <div class="clip-preview">
      <img class="clip-thumb" src="${clipImageUrl}" alt="Food photo">
      <div class="clip-matches">
        ${clipResults.map((r, i) => {
          const sel = clipSelectedItems.has(r.label);
          const item = sel ? clipSelectedItems.get(r.label) : null;
          const hint = getPortionHint(r.label);
          return `
          <div class="clip-match ${sel ? 'selected' : ''}"
               onclick="toggleClipItem('${esc(r.label)}', event)">
            <div class="clip-match-top">
              <div class="clip-match-check">${sel ? '✓' : ''}</div>
              <span class="clip-match-name">${esc(r.label)}</span>
              <span class="clip-match-score">${(r.score * 100).toFixed(1)}%</span>
            </div>
            ${sel ? `<div class="clip-match-controls" onclick="event.stopPropagation()">
              <div class="clip-size-btns">
                <button class="clip-size-btn ${item.size==='S'?'active':''}" onclick="setClipSize('${esc(r.label)}','S')">S</button>
                <button class="clip-size-btn ${item.size==='M'?'active':''}" onclick="setClipSize('${esc(r.label)}','M')">M</button>
                <button class="clip-size-btn ${item.size==='L'?'active':''}" onclick="setClipSize('${esc(r.label)}','L')">L</button>
              </div>
              <input type="number" class="clip-qty-input" value="${item.qty}"
                     onchange="updateClipQty('${esc(r.label)}', this.value)"
                     min="1" step="5">
              <span class="clip-qty-unit">g</span>
              <span class="clip-portion-hint">${esc(hint)}</span>
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="clip-actions">
      <button class="btn-clip-add" onclick="addClipToInput()" ${clipSelectedItems.size === 0 ? 'disabled' : ''}>
        Add to input
      </button>
    </div>
  `;
}

window.toggleClipItem = function(label, event) {
  if (event && (event.target.closest('.clip-match-controls'))) return;
  if (clipSelectedItems.has(label)) clipSelectedItems.delete(label);
  else clipSelectedItems.set(label, { qty: getTypicalServing(label), unit: 'g', size: 'M' });
  renderClipResults();
};

window.updateClipQty = function(label, value) {
  const qty = Math.max(1, parseInt(value) || 100);
  if (clipSelectedItems.has(label)) {
    clipSelectedItems.set(label, { qty, unit: 'g', size: null });
  }
};

window.setClipSize = function(label, size) {
  const base = getTypicalServing(label);
  const multipliers = { S: 0.5, M: 1, L: 1.5 };
  const qty = Math.round(base * (multipliers[size] || 1));
  clipSelectedItems.set(label, { qty, unit: 'g', size });
  renderClipResults();
};

window.addClipToInput = function() {
  const textarea = $('inp');
  const existing = textarea.value.trim();
  const newLines = [...clipSelectedItems.entries()]
    .map(([label, s]) => `${s.qty}g ${label}`)
    .join('\n');
  textarea.value = existing ? existing + '\n' + newLines : newLines;
  closeClip();
  textarea.focus();
};

window.closeClip = function() {
  const panel = $('clipPanel');
  panel.classList.remove('active');
  panel.innerHTML = '';
  clipSelectedItems = new Map();
  if (clipImageUrl) { URL.revokeObjectURL(clipImageUrl); clipImageUrl = null; }
};

window.handlePhoto = handlePhoto;

// ═══════════════════════════════════════════
// STATE & ACTIONS
// ═══════════════════════════════════════════
const S = { entries: [] };
const $ = id => document.getElementById(id);

$('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doLog(); }
});

async function doLog() {
  const text = $('inp').value.trim();
  if (!text) return;
  hideErr();

  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const parsed = lines.map(parseLine).filter(Boolean);
  if (!parsed.length) return;

  $('logBtn').disabled = true;
  $('loadZone').innerHTML = `<div class="loading"><div class="spin"></div><span>Looking up ${parsed.length} item${parsed.length>1?'s':''} …</span></div>`;

  try {
    const items = await Promise.all(parsed.map(lookupItem));
    const misses = items.filter(i => i.calories === 0);

    const entry = {
      id: Date.now(), time: new Date(), items,
      totalCal: items.reduce((s,i) => s + i.calories, 0),
      totalPro: items.reduce((s,i) => s + i.protein, 0),
      totalCarb: items.reduce((s,i) => s + i.carbs, 0),
      totalFat: items.reduce((s,i) => s + i.fat, 0),
    };
    S.entries.unshift(entry);
    $('inp').value = '';
    if (misses.length) showErr(`No match: ${misses.map(i=>i.name).join(', ')}. Logged as 0.`);
    render();
  } catch (err) {
    showErr('Something went wrong: ' + err.message);
  } finally {
    $('logBtn').disabled = false;
    $('loadZone').innerHTML = '';
  }
}

window.doLog = doLog;
window.clearAll = function() { S.entries = []; render(); };
window.rmEntry = function(id) { S.entries = S.entries.filter(e => e.id !== id); render(); };

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render() {
  const tc = S.entries.reduce((s,e) => s + e.totalCal, 0);
  const tp = S.entries.reduce((s,e) => s + e.totalPro, 0);
  const tcb = S.entries.reduce((s,e) => s + e.totalCarb, 0);
  const tf = S.entries.reduce((s,e) => s + e.totalFat, 0);
  $('tCal').textContent = tc.toLocaleString();
  $('tPro').textContent = fmtNum(tp);
  $('tCarb').textContent = fmtNum(tcb);
  $('tFat').textContent = fmtNum(tf);

  if (!S.entries.length) {
    $('entries').innerHTML = '';
    $('secHead').style.display = 'none';
    $('empty').style.display = '';
    return;
  }
  $('secHead').style.display = '';
  $('empty').style.display = 'none';

  $('entries').innerHTML = S.entries.map(e => `
    <div class="entry">
      <div class="entry-head">
        <span class="entry-time">${fmtTime(e.time)}</span>
        <button class="btn-rm" onclick="rmEntry(${e.id})" title="Remove">&#10005;</button>
      </div>
      <div class="entry-rows">
        ${e.items.map(it => `
          <div class="erow">
            <span class="erow-name">${esc(it.name)}</span>
            <span class="erow-match" title="${esc(it.match)}">${esc(it.match)}</span>
            <div class="erow-macros">
              <span class="pill c">${it.calories}</span>
              <span class="pill p">${it.protein}g</span>
              <span class="pill cb">${it.carbs}g</span>
              <span class="pill f">${it.fat}g</span>
            </div>
          </div>
        `).join('')}
      </div>
      ${e.items.length > 1 ? `
        <div class="entry-foot">
          <span class="pill c">${e.totalCal} kcal</span>
          <span class="pill p">${fmtNum(e.totalPro)}p</span>
          <span class="pill cb">${fmtNum(e.totalCarb)}c</span>
          <span class="pill f">${fmtNum(e.totalFat)}f</span>
        </div>` : ''}
    </div>
  `).join('');
}

function fmtTime(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtNum(n) { return n % 1 === 0 ? n : n.toFixed(1); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showErr(msg) { const el = $('err'); el.textContent = msg; el.style.display = 'block'; }
function hideErr() { $('err').style.display = 'none'; }
</script>
</body>
</html>
