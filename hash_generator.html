<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Generator</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .container { max-width: 600px; }

  .input-tabs {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border-radius: 6px;
    padding: 3px;
    border: 1px solid var(--border);
    margin-bottom: 1rem;
  }

  .input-tab {
    flex: 1;
    padding: 7px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .input-tab.active { background: var(--accent); color: #fff; }
  .input-tab:not(.active):hover { color: var(--text); }

  .text-input {
    width: 100%;
    min-height: 100px;
    padding: 0.65rem 0.75rem;
    font-size: 0.88rem;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    border-radius: 6px;
    resize: vertical;
    margin-bottom: 1rem;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 1rem;
    display: none;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--drop-hover);
  }

  .drop-zone p { font-size: 0.88rem; color: var(--text-muted); }
  .drop-zone .icon { font-size: 1.5rem; margin-bottom: 0.3rem; display: block; }

  .file-info {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
    display: none;
  }

  .file-info strong { color: var(--text); }

  /* Hash results */
  .hash-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .hash-item {
    padding: 0.65rem 0.8rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .hash-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.3rem;
  }

  .hash-algo {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .hash-copy {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .hash-copy:hover { color: var(--accent); background: var(--accent-dim); }

  .hash-value {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.78rem;
    word-break: break-all;
    line-height: 1.5;
    color: var(--text);
    cursor: pointer;
  }

  .hash-value:hover { color: var(--accent); }

  .hash-computing {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .encoding-toggle {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 1rem;
  }

  .encoding-toggle label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .encoding-toggle select {
    padding: 0.35rem 0.5rem;
    font-size: 0.82rem;
    border-radius: 6px;
  }

  .copied-toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.2s;
    pointer-events: none;
    z-index: 100;
  }

  .copied-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Hash Generator</h1>
    <a href="/">&#8592; all tools</a>
  </header>
  <p class="desc">Generate MD5, SHA-1, SHA-256, and SHA-512 hashes from text or files using the Web Crypto API.</p>

  <div class="input-tabs">
    <button class="input-tab active" data-mode="text" onclick="setMode('text')">Text</button>
    <button class="input-tab" data-mode="file" onclick="setMode('file')">File</button>
  </div>

  <textarea class="text-input" id="text-input" placeholder="Type or paste text to hash..."></textarea>

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <span class="icon">&#128196;</span>
    <p>Drop a file here or click to select</p>
  </div>
  <input type="file" id="file-input" style="display:none">

  <div class="file-info" id="file-info"></div>

  <div class="encoding-toggle">
    <label>Output</label>
    <select id="encoding" onchange="rehash()">
      <option value="hex">Hex (lowercase)</option>
      <option value="hex-upper">Hex (uppercase)</option>
      <option value="base64">Base64</option>
    </select>
  </div>

  <div class="hash-list" id="hash-list"></div>
</div>

<div class="copied-toast" id="toast">Copied</div>

<script src="/theme.js"></script>
<script>
// MD5 implementation (Web Crypto doesn't support MD5)
function md5(buffer) {
  const bytes = new Uint8Array(buffer);
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  const s=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K=new Uint32Array([0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391]);
  const bitLen=bytes.length*8;
  const padLen=bytes.length+1;
  const totalLen=padLen+(64-((padLen+8)%64))%64+8;
  const padded=new Uint8Array(totalLen);
  padded.set(bytes);padded[bytes.length]=0x80;
  const view=new DataView(padded.buffer);
  view.setUint32(totalLen-8,bitLen&0xffffffff,true);
  view.setUint32(totalLen-4,Math.floor(bitLen/0x100000000),true);
  for(let i=0;i<totalLen;i+=64){
    const M=new Uint32Array(16);
    for(let j=0;j<16;j++)M[j]=view.getUint32(i+j*4,true);
    let A=a0,B=b0,C=c0,D=d0;
    for(let j=0;j<64;j++){
      let F,g;
      if(j<16){F=(B&C)|((~B)&D);g=j;}
      else if(j<32){F=(D&B)|((~D)&C);g=(5*j+1)%16;}
      else if(j<48){F=B^C^D;g=(3*j+5)%16;}
      else{F=C^(B|(~D));g=(7*j)%16;}
      F=((F>>>0)+(A>>>0)+(K[j]>>>0)+(M[g]>>>0))>>>0;
      A=D;D=C;C=B;
      B=((B>>>0)+((F<<s[j])|(F>>>(32-s[j])))>>>0)>>>0;
    }
    a0=((a0+A)>>>0);b0=((b0+B)>>>0);c0=((c0+C)>>>0);d0=((d0+D)>>>0);
  }
  const result=new Uint8Array(16);
  const rv=new DataView(result.buffer);
  rv.setUint32(0,a0,true);rv.setUint32(4,b0,true);rv.setUint32(8,c0,true);rv.setUint32(12,d0,true);
  return result;
}

const ALGOS = [
  { name: 'MD5', webcrypto: null },
  { name: 'SHA-1', webcrypto: 'SHA-1' },
  { name: 'SHA-256', webcrypto: 'SHA-256' },
  { name: 'SHA-512', webcrypto: 'SHA-512' }
];

let currentMode = 'text';
let currentHashes = {};
let fileBuffer = null;

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.input-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('text-input').style.display = mode === 'text' ? '' : 'none';
  document.getElementById('drop-zone').style.display = mode === 'file' ? '' : 'none';
  if (mode === 'text') {
    document.getElementById('file-info').style.display = 'none';
    hashText();
  }
}

// Text hashing
document.getElementById('text-input').addEventListener('input', hashText);

async function hashText() {
  const text = document.getElementById('text-input').value;
  const buffer = new TextEncoder().encode(text).buffer;
  await computeHashes(buffer);
}

// File handling
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

async function handleFile(file) {
  const info = document.getElementById('file-info');
  info.innerHTML = '<strong>' + esc(file.name) + '</strong> (' + formatSize(file.size) + ')';
  info.style.display = '';

  showComputing();
  fileBuffer = await file.arrayBuffer();
  await computeHashes(fileBuffer);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function showComputing() {
  document.getElementById('hash-list').innerHTML = ALGOS.map(a =>
    '<div class="hash-item"><div class="hash-header"><span class="hash-algo">' + a.name + '</span></div>' +
    '<div class="hash-computing">Computing...</div></div>'
  ).join('');
}

async function computeHashes(buffer) {
  currentHashes = {};
  const encoding = document.getElementById('encoding').value;

  const results = await Promise.all(ALGOS.map(async (algo) => {
    let hashBytes;
    if (algo.webcrypto) {
      const digest = await crypto.subtle.digest(algo.webcrypto, buffer);
      hashBytes = new Uint8Array(digest);
    } else {
      hashBytes = md5(buffer);
    }
    return { name: algo.name, bytes: hashBytes };
  }));

  results.forEach(r => {
    currentHashes[r.name] = r.bytes;
  });

  renderHashes();
}

function renderHashes() {
  const encoding = document.getElementById('encoding').value;
  const list = document.getElementById('hash-list');

  list.innerHTML = ALGOS.map(algo => {
    const bytes = currentHashes[algo.name];
    if (!bytes) return '';
    const formatted = formatHash(bytes, encoding);
    return '<div class="hash-item">' +
      '<div class="hash-header">' +
        '<span class="hash-algo">' + algo.name + '</span>' +
        '<button class="hash-copy" onclick="copyText(\'' + formatted.replace(/'/g, "\\'") + '\')">Copy</button>' +
      '</div>' +
      '<div class="hash-value" onclick="copyText(\'' + formatted.replace(/'/g, "\\'") + '\')">' + formatted + '</div>' +
    '</div>';
  }).join('');
}

function formatHash(bytes, encoding) {
  if (encoding === 'base64') {
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary);
  }
  const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
  return encoding === 'hex-upper' ? hex.toUpperCase() : hex;
}

function rehash() {
  if (Object.keys(currentHashes).length > 0) {
    renderHashes();
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.textContent = 'Copied';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  });
}

// Initial hash of empty text
hashText();
</script>
</body>
</html>
