<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Markdown → PDF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface-2: #1e2026;
    --border: #2a2d35;
    --text: #e4e6eb;
    --text-dim: #8b8f9a;
    --accent: #4a7cff;
    --accent-glow: rgba(74, 124, 255, 0.15);
    --green: #34d399;
    --red: #f87171;
    --orange: #fbbf24;
    --radius: 12px;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    padding: 20px 16px 12px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 0.82rem; color: var(--text-dim); margin-top: 4px; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--text); }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #5d8bff; border-color: #5d8bff; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-file { position: relative; overflow: hidden; }
  .btn-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

  .file-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--green);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Tab switcher (mobile) ── */
  .tab-bar {
    display: none;
    padding: 0 16px 8px;
    gap: 0;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:first-child { border-radius: 8px 0 0 8px; }
  .tab-btn:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── Editor area ── */
  .editor-wrap {
    flex: 1;
    display: flex;
    gap: 0;
    padding: 0 16px 16px;
    min-height: 0;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .pane-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 8px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .pane:first-child .pane-label { border-radius: var(--radius) 0 0 0; }
  .pane:last-child .pane-label { border-radius: 0 var(--radius) 0 0; border-left: none; }

  #editor {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-top: none;
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.6;
    padding: 16px;
    outline: none;
    tab-size: 2;
    -moz-tab-size: 2;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .pane:first-child #editor { border-radius: 0 0 0 var(--radius); }

  .preview-frame {
    flex: 1;
    border: 1px solid var(--border);
    border-top: none;
    border-left: none;
    background: #fff;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 0 0 var(--radius) 0;
  }

  #preview {
    padding: 24px 20px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 11pt;
    line-height: 1.65;
    color: #1a1a1a;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  /* ── Preview typography ── */
  #preview h1 { font-size: 1.8em; font-weight: 700; margin: 0.6em 0 0.4em; border-bottom: 1px solid #e5e5e5; padding-bottom: 0.3em; }
  #preview h2 { font-size: 1.45em; font-weight: 700; margin: 0.8em 0 0.3em; border-bottom: 1px solid #eee; padding-bottom: 0.2em; }
  #preview h3 { font-size: 1.2em; font-weight: 700; margin: 0.8em 0 0.3em; }
  #preview h4, #preview h5, #preview h6 { font-size: 1em; font-weight: 700; margin: 0.8em 0 0.3em; }
  #preview p { margin: 0 0 0.8em; }
  #preview ul, #preview ol { margin: 0 0 0.8em; padding-left: 1.8em; }
  #preview li { margin: 0.2em 0; }
  #preview blockquote {
    margin: 0 0 0.8em;
    padding: 0.5em 1em;
    border-left: 4px solid #ddd;
    color: #555;
    background: #f9f9f9;
  }
  #preview code {
    font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    font-size: 0.88em;
    background: #f3f4f6;
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }
  #preview pre {
    margin: 0 0 0.8em;
    padding: 12px 16px;
    background: #f6f8fa;
    border-radius: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  #preview pre code { background: none; padding: 0; font-size: 0.82em; line-height: 1.55; }
  #preview table { border-collapse: collapse; width: 100%; margin: 0 0 0.8em; }
  #preview th, #preview td { border: 1px solid #d0d7de; padding: 6px 12px; text-align: left; }
  #preview th { background: #f6f8fa; font-weight: 600; }
  #preview img { max-width: 100%; height: auto; border-radius: 4px; }
  #preview hr { border: none; border-top: 1px solid #e5e5e5; margin: 1.5em 0; }
  #preview a { color: #0969da; }

  /* ── Drop overlay ── */
  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(14, 15, 17, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .drop-overlay.active { display: flex; }
  .drop-overlay-inner {
    border: 2px dashed var(--accent);
    border-radius: 16px;
    padding: 48px 64px;
    text-align: center;
    background: var(--surface);
  }
  .drop-overlay-inner svg { width: 48px; height: 48px; color: var(--accent); margin-bottom: 12px; }
  .drop-overlay-inner p { font-size: 1rem; font-weight: 500; }
  .drop-overlay-inner span { font-size: 0.82rem; color: var(--text-dim); display: block; margin-top: 4px; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font-size: 0.82rem; padding: 10px 20px; border-radius: 8px;
    opacity: 0; transition: all 0.35s ease; z-index: 200; max-width: 90vw; text-align: center;
  }
  .toast.error { border-color: var(--red); }
  .toast.success { border-color: var(--green); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Footer ── */
  .footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    opacity: 0.6;
    padding: 8px 16px;
    flex-shrink: 0;
  }

  /* ── Hidden render container ── */
  #renderContainer {
    position: absolute; left: -9999px; top: 0;
    width: 794px; background: white; z-index: -1; pointer-events: none;
  }

  /* ── Responsive: mobile ── */
  @media (max-width: 700px) {
    .tab-bar { display: flex; }
    .editor-wrap { flex-direction: column; }

    .pane-label { display: none; }

    .pane:first-child #editor {
      border-radius: 0;
      border: 1px solid var(--border);
    }
    .preview-frame {
      border: 1px solid var(--border);
      border-radius: 0;
    }

    .pane.hidden-mobile { display: none; }
  }

  @media (min-width: 701px) {
    .tab-bar { display: none !important; }
  }

  /* ── Generating spinner ── */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>Markdown <span>→</span> PDF</h1>
  <p>Write or drop a .md file, preview, and export to PDF</p>
</div>

<div class="toolbar">
  <label class="btn btn-file">
    Open .md
    <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.mkdn,.mdwn,.txt,text/markdown,text/plain">
  </label>
  <span class="file-name" id="fileName"></span>
  <div style="flex:1"></div>
  <button class="btn" id="btnClear">Clear</button>
  <button class="btn btn-primary" id="btnExport">Export PDF</button>
</div>

<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-tab="edit">Edit</button>
  <button class="tab-btn" data-tab="preview">Preview</button>
</div>

<div class="editor-wrap">
  <div class="pane" id="editPane">
    <div class="pane-label">Markdown</div>
    <textarea id="editor" spellcheck="false" placeholder="# Hello World

Start typing markdown here, or drop a .md file anywhere...

## Features
- **Bold**, *italic*, ~~strikethrough~~
- Lists, tables, code blocks
- Live preview → Export to PDF"></textarea>
  </div>
  <div class="pane hidden-mobile" id="previewPane">
    <div class="pane-label">Preview</div>
    <div class="preview-frame">
      <div id="preview"></div>
    </div>
  </div>
</div>

<div class="footer">100% client-side · no uploads · no servers</div>

<div class="drop-overlay" id="dropOverlay">
  <div class="drop-overlay-inner">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
    </svg>
    <p>Drop your .md file</p>
    <span>Markdown or plain text</span>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="renderContainer"></div>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const editor = $('editor'), preview = $('preview');
  const fileInput = $('fileInput'), fileName = $('fileName');
  const btnExport = $('btnExport'), btnClear = $('btnClear');
  const dropOverlay = $('dropOverlay');
  const toastEl = $('toast');
  const renderContainer = $('renderContainer');

  /* ── Markdown setup ── */
  marked.setOptions({
    gfm: true,
    breaks: true,
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch {}
      }
      try { return hljs.highlightAuto(code).value; } catch {}
      return code;
    }
  });

  /* ── Live preview ── */
  let renderTimeout;
  function updatePreview() {
    clearTimeout(renderTimeout);
    renderTimeout = setTimeout(() => {
      try {
        preview.innerHTML = marked.parse(editor.value);
      } catch (e) {
        preview.innerHTML = '<p style="color:red">Parse error</p>';
      }
    }, 150);
  }
  editor.addEventListener('input', updatePreview);

  /* ── Tab handling ── */
  function handleTab(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      updatePreview();
    }
  }
  editor.addEventListener('keydown', handleTab);

  /* ── Mobile tabs ── */
  const tabBtns = document.querySelectorAll('.tab-btn');
  const editPane = $('editPane'), previewPane = $('previewPane');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.tab === 'edit') {
        editPane.classList.remove('hidden-mobile');
        previewPane.classList.add('hidden-mobile');
      } else {
        previewPane.classList.remove('hidden-mobile');
        editPane.classList.add('hidden-mobile');
        updatePreview();
      }
    });
  });

  /* ── File input ── */
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) loadFile(fileInput.files[0]);
    fileInput.value = '';
  });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      editor.value = reader.result;
      fileName.textContent = file.name;
      updatePreview();
      toast('Loaded ' + file.name, 'success');
    };
    reader.onerror = () => toast('Could not read file', 'error');
    reader.readAsText(file);
  }

  /* ── Drag & drop ── */
  let dragCounter = 0;
  document.addEventListener('dragenter', e => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('active');
  });
  document.addEventListener('dragleave', e => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('active');
    const files = e.dataTransfer.files;
    if (files.length) loadFile(files[0]);
  });

  /* ── Clear ── */
  btnClear.addEventListener('click', () => {
    editor.value = '';
    fileName.textContent = '';
    updatePreview();
  });

  /* ── Toast ── */
  function toast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + (type || '') + ' show';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  /* ── PDF Export ── */
  btnExport.addEventListener('click', exportPdf);

  async function exportPdf() {
    const md = editor.value.trim();
    if (!md) { toast('Nothing to export', 'error'); return; }

    btnExport.disabled = true;
    btnExport.innerHTML = '<span class="spinner"></span>Generating…';

    try {
      // Render markdown into hidden container with print styles
      const html = marked.parse(md);
      renderContainer.innerHTML = '';
      Object.assign(renderContainer.style, {
        width: '794px', padding: '56px 60px', background: '#fff',
        fontFamily: 'Georgia, "Times New Roman", serif',
        fontSize: '11pt', lineHeight: '1.65', color: '#1a1a1a',
      });

      const style = document.createElement('style');
      style.textContent = `
        #renderContainer h1 { font-size:1.8em; font-weight:700; margin:0.6em 0 0.4em; border-bottom:1px solid #e5e5e5; padding-bottom:0.3em; }
        #renderContainer h2 { font-size:1.45em; font-weight:700; margin:0.8em 0 0.3em; border-bottom:1px solid #eee; padding-bottom:0.2em; }
        #renderContainer h3 { font-size:1.2em; font-weight:700; margin:0.8em 0 0.3em; }
        #renderContainer h4, #renderContainer h5, #renderContainer h6 { font-size:1em; font-weight:700; margin:0.8em 0 0.3em; }
        #renderContainer p { margin:0 0 0.8em; orphans:3; widows:3; }
        #renderContainer ul, #renderContainer ol { margin:0 0 0.8em; padding-left:1.8em; }
        #renderContainer li { margin:0.2em 0; }
        #renderContainer blockquote { margin:0 0 0.8em; padding:0.5em 1em; border-left:4px solid #ddd; color:#555; background:#f9f9f9; }
        #renderContainer code { font-family:'JetBrains Mono','SF Mono',Consolas,monospace; font-size:0.88em; background:#f3f4f6; padding:0.15em 0.4em; border-radius:4px; }
        #renderContainer pre { margin:0 0 0.8em; padding:12px 16px; background:#f6f8fa; border-radius:6px; overflow-x:auto; }
        #renderContainer pre code { background:none; padding:0; font-size:0.82em; line-height:1.55; }
        #renderContainer table { border-collapse:collapse; width:100%; margin:0 0 0.8em; }
        #renderContainer th, #renderContainer td { border:1px solid #d0d7de; padding:6px 12px; text-align:left; }
        #renderContainer th { background:#f6f8fa; font-weight:600; }
        #renderContainer img { max-width:100%; height:auto; border-radius:4px; }
        #renderContainer hr { border:none; border-top:1px solid #e5e5e5; margin:1.5em 0; }
        #renderContainer a { color:#0969da; text-decoration:none; }
      `;
      renderContainer.appendChild(style);

      const content = document.createElement('div');
      content.innerHTML = html.replace(/<script[\s\S]*?<\/script>/gi, '')
                              .replace(/on\w+\s*=\s*["'][^"']*["']/gi, '');
      renderContainer.appendChild(content);

      // Apply highlight.js to code blocks
      renderContainer.querySelectorAll('pre code').forEach(block => {
        try { hljs.highlightElement(block); } catch {}
      });

      // Wait for any images
      await Promise.allSettled(
        Array.from(renderContainer.querySelectorAll('img')).map(img =>
          img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })
        )
      );

      // Small delay for rendering
      await new Promise(r => setTimeout(r, 100));

      // Capture to canvas
      const canvas = await html2canvas(renderContainer, {
        scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff',
        width: 794, windowWidth: 794,
      });
      renderContainer.innerHTML = '';

      // Paginate into A4 PDF
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('portrait', 'mm', 'a4');
      const pageW = 210, pageH = 297;
      const canvasW = canvas.width, canvasH = canvas.height;
      const mmPerPx = pageW / canvasW;
      const pxPerPage = pageH / mmPerPx;
      const totalPages = Math.ceil(canvasH / pxPerPage);

      for (let p = 0; p < totalPages; p++) {
        if (p > 0) pdf.addPage();
        const srcY = p * pxPerPage;
        const sliceH = Math.min(pxPerPage, canvasH - srcY);

        const slice = document.createElement('canvas');
        slice.width = canvasW;
        slice.height = sliceH;
        const ctx = slice.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvasW, sliceH);
        ctx.drawImage(canvas, 0, srcY, canvasW, sliceH, 0, 0, canvasW, sliceH);

        pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pageW, sliceH * mmPerPx);
      }

      const blob = pdf.output('blob');
      await downloadPdf(blob);
      toast('PDF exported', 'success');

    } catch (err) {
      console.error('Export error:', err);
      toast('Export failed: ' + (err.message || 'unknown error'), 'error');
    } finally {
      btnExport.disabled = false;
      btnExport.textContent = 'Export PDF';
    }
  }

  /* ── Download (iOS-friendly) ── */
  async function downloadPdf(blob) {
    const name = (fileName.textContent || 'document').replace(/\.\w+$/, '') + '.pdf';
    const pdfFile = new File([blob], name, { type: 'application/pdf' });

    // 1) Web Share API (iOS 15+ → native share sheet)
    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      try {
        await navigator.share({ files: [pdfFile], title: name });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }

    // 2) iOS fallback: open in new tab
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast('PDF opened — tap share to save', 'success');
      return;
    }

    // 3) Desktop: standard <a download>
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // Initial render
  updatePreview();
})();
</script>
</body>
</html>
