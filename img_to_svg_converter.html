<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vector Lab — Image ↔ SVG</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
<style>
  /* ── Layout ── */
  .app { min-height: 100dvh; display: flex; flex-direction: column; max-width: 1180px; margin: 0 auto; padding: 14px 16px; }

  /* ── Header ── */
  header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); display: grid; place-items: center; }
  .logo-mark svg { width: 16px; height: 16px; }
  .logo h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.025em; }
  .logo h1 span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 5px; }

  .mode-switch { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 2px; }
  .mode-switch button { font-family: monospace; font-size: 11.5px; padding: 5px 13px; border: none; border-radius: 5px; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 150ms ease; font-weight: 500; }
  .mode-switch button:hover { color: var(--text); }
  .mode-switch button.on { background: var(--accent); color: #fff; }

  /* ── Workspace ── */
  .workspace { flex: 1; display: flex; flex-direction: column; gap: 14px; }

  /* ── Drop zone ── */
  .dropzone { border: 2px dashed var(--border); border-radius: 14px; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 180ms ease; background: var(--surface); position: relative; min-height: 140px; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--drop-hover); }
  .dropzone .icon { width: 42px; height: 42px; border-radius: 10px; background: var(--surface-alt); display: grid; place-items: center; transition: all 180ms ease; }
  .dropzone:hover .icon, .dropzone.over .icon { background: var(--accent); }
  .dropzone .icon svg { width: 20px; height: 20px; color: var(--text-muted); transition: color 180ms; }
  .dropzone:hover .icon svg, .dropzone.over .icon svg { color: #fff; }
  .dropzone p { font-size: 13.5px; color: var(--text-muted); text-align: center; }
  .dropzone p b { color: var(--accent); font-weight: 600; }
  .dropzone .tag { font-family: monospace; font-size: 10.5px; color: var(--text-muted); background: var(--surface-alt); padding: 3px 9px; border-radius: 20px; }
  .dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* ── Controls ── */
  .controls { display: none; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; flex-wrap: wrap; align-items: end; }
  .controls.show { display: flex; }
  .ctrl { flex: 1; min-width: 120px; }
  .ctrl label { display: flex; justify-content: space-between; font-family: monospace; font-size: 10.5px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
  .ctrl .val { color: var(--accent); }
  .ctrl input[type=range] { width: 100%; -webkit-appearance: none; height: 5px; border-radius: 3px; background: var(--surface-alt); outline: none; }
  .ctrl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .ctrl select { width: 100%; padding: 7px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: monospace; font-size: 12px; cursor: pointer; outline: none; }
  .ctrl select:focus { border-color: var(--accent); }

  /* ── Preview ── */
  .previews { display: none; flex: 1; gap: 12px; min-height: 280px; }
  .previews.show { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .panel-head span { font-family: monospace; font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .panel-head .meta { color: var(--text-muted); text-transform: none; }
  .panel-body { flex: 1; display: grid; place-items: center; padding: 14px; overflow: auto; background: repeating-conic-gradient(var(--surface-alt) 0% 25%, transparent 0% 50%) 0 0/14px 14px; min-height: 180px; }
  .panel-body img, .panel-body svg { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ── Actions ── */
  .actions { display: none; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; flex-wrap: wrap; }
  .actions.show { display: flex; }
  .fname { font-family: monospace; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .btns { display: flex; gap: 7px; flex-wrap: wrap; }
  .btn { font-size: 13.5px; font-weight: 600; padding: 9px 18px; border: none; border-radius: 7px; cursor: pointer; transition: all 150ms ease; display: inline-flex; align-items: center; gap: 7px; }
  .btn svg { width: 15px; height: 15px; }
  .btn-p { background: var(--accent); color: #fff; }
  .btn-p:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-p:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-g { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
  .btn-g:hover { border-color: var(--border-hover); color: var(--text); }

  /* ── Overlay / Toast ── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; place-items: center; }
  .overlay.show { display: grid; }
  .spin { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; margin: 0 auto 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .overlay p { font-family: monospace; font-size: 12px; color: var(--text-muted); text-align: center; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(90px); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 18px; font-family: monospace; font-size: 11.5px; z-index: 200; transition: transform 280ms cubic-bezier(.34,1.56,.64,1); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok { border-color: var(--green); color: var(--green); }

  .lib-warn { display: none; background: var(--amber-dim); border: 1px solid var(--amber); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--amber); }
  .lib-warn.show { display: block; }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .logo h1 span { display: none; }
    .previews.show { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .actions { flex-direction: column; align-items: stretch; }
    .actions .btn { justify-content: center; }
    .fname { text-align: center; max-width: 100%; }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg></div>
      <h1>Vector Lab <span>Image ↔ SVG</span></h1>
    </div>
    <div class="mode-switch">
      <button class="on" data-m="r2s">IMG → SVG</button>
      <button data-m="s2r">SVG → IMG</button>
    </div>
  </header>

  <div class="lib-warn" id="libWarn">ImageTracer library failed to load. Check your network connection or ad-blocker — the CDN script may be blocked.</div>

  <div class="workspace">
    <div class="dropzone" id="dz">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
      <p>Drop your image here, <b>browse</b>, or paste from clipboard</p>
      <span class="tag" id="hint">PNG · JPG · WEBP · GIF</span>
      <input type="file" id="fi" accept="image/png,image/jpeg,image/webp,image/gif">
    </div>

    <div class="controls" id="ctrls">
      <!-- IMG → SVG -->
      <div class="ctrl r2s"><label>Colors <span class="val" id="vColors">16</span></label><input type="range" id="sColors" min="2" max="64" value="16"></div>
      <div class="ctrl r2s"><label>Line detail <span class="val" id="vLtres">1.0</span></label><input type="range" id="sLtres" min="1" max="100" value="10"></div>
      <div class="ctrl r2s"><label>Curve detail <span class="val" id="vQtres">1.0</span></label><input type="range" id="sQtres" min="1" max="100" value="10"></div>
      <div class="ctrl r2s"><label>Preset</label>
        <select id="xPreset">
          <option value="">Custom</option>
          <option value="default" selected>Default</option>
          <option value="posterized1">Posterized</option>
          <option value="posterized3">Posterized HD</option>
          <option value="curvy">Curvy</option>
          <option value="sharp">Sharp</option>
          <option value="detailed">Detailed</option>
          <option value="smoothed">Smoothed</option>
          <option value="artistic1">Artistic 1</option>
          <option value="artistic2">Artistic 2</option>
        </select>
      </div>
      <!-- SVG → IMG -->
      <div class="ctrl s2r" style="display:none"><label>Width <span class="val" id="vW">1024px</span></label><input type="range" id="sW" min="64" max="4096" value="1024"></div>
      <div class="ctrl s2r" style="display:none"><label>Format</label><select id="xFmt"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></div>
      <div class="ctrl s2r" style="display:none"><label>Quality <span class="val" id="vQ">92%</span></label><input type="range" id="sQ" min="10" max="100" value="92"></div>
    </div>

    <div class="previews" id="previews">
      <div class="panel"><div class="panel-head"><span id="lOrig">Original</span><span class="meta" id="mOrig"></span></div><div class="panel-body" id="pOrig"></div></div>
      <div class="panel"><div class="panel-head"><span id="lConv">Converted</span><span class="meta" id="mConv"></span></div><div class="panel-body" id="pConv"></div></div>
    </div>

    <div class="actions" id="actions">
      <span class="fname" id="fname"></span>
      <div class="btns">
        <button class="btn btn-g" id="bReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> Reset</button>
        <button class="btn btn-p" id="bConvert" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg> Convert</button>
        <button class="btn btn-p" id="bDl" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="ov"><div><div class="spin"></div><p id="ovTxt">Tracing…</p></div></div>
<div class="toast" id="toast"></div>

<script src="/theme.js"></script>
<script>
(function(){
  'use strict';

  // ── State ──
  let mode = 'r2s', srcFile = null, srcImg = null, srcData = null;
  let result = null, blobUrl = null, natW = 0, natH = 0;

  // ── DOM ──
  const $ = id => document.getElementById(id);
  const dz=$('dz'), fi=$('fi'), hint=$('hint'), ctrls=$('ctrls');
  const previews=$('previews'), pOrig=$('pOrig'), pConv=$('pConv');
  const mOrig=$('mOrig'), mConv=$('mConv'), lOrig=$('lOrig'), lConv=$('lConv');
  const actions=$('actions'), fname=$('fname');
  const bConvert=$('bConvert'), bDl=$('bDl'), bReset=$('bReset');
  const ov=$('ov'), ovTxt=$('ovTxt'), toast=$('toast'), libWarn=$('libWarn');

  // Controls
  const sColors=$('sColors'), sLtres=$('sLtres'), sQtres=$('sQtres'), xPreset=$('xPreset');
  const vColors=$('vColors'), vLtres=$('vLtres'), vQtres=$('vQtres');
  const sW=$('sW'), xFmt=$('xFmt'), sQ=$('sQ'), vW=$('vW'), vQ=$('vQ');

  // ── Library check ──
  if (typeof ImageTracer === 'undefined') libWarn.classList.add('show');

  // ── Mode switch ──
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.addEventListener('click', () => {
      const m = b.dataset.m;
      if (m === mode) return;
      mode = m;
      document.querySelectorAll('.mode-switch button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      syncMode(); reset();
    });
  });

  function syncMode() {
    const r = mode === 'r2s';
    fi.accept = r ? 'image/png,image/jpeg,image/webp,image/gif' : 'image/svg+xml,.svg';
    hint.textContent = r ? 'PNG · JPG · WEBP · GIF' : 'SVG files';
    lOrig.textContent = r ? 'Original' : 'SVG Source';
    lConv.textContent = r ? 'SVG Output' : 'Raster Output';
    document.querySelectorAll('.ctrl.r2s').forEach(el => el.style.display = r ? '' : 'none');
    document.querySelectorAll('.ctrl.s2r').forEach(el => el.style.display = r ? 'none' : '');
  }

  // ── Drag & drop ──
  ['dragenter','dragover','dragleave','drop'].forEach(e =>
    dz.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); }));
  dz.addEventListener('dragenter', () => dz.classList.add('over'));
  dz.addEventListener('dragover', () => dz.classList.add('over'));
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => { dz.classList.remove('over'); if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); });
  fi.addEventListener('change', e => { if (e.target.files[0]) handle(e.target.files[0]); });

  // ── Clipboard paste ──
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const it of items) {
      if (it.type.startsWith('image/')) { e.preventDefault(); handle(it.getAsFile()); return; }
    }
  });

  // ── File handling ──
  function handle(file) {
    const r = mode === 'r2s';
    if (r && !/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) { notify('Drop a PNG, JPG, WebP or GIF', 'err'); return; }
    if (!r && file.type !== 'image/svg+xml' && !file.name.endsWith('.svg')) { notify('Drop an SVG file', 'err'); return; }
    srcFile = file;
    fname.textContent = file.name;
    result = null; bDl.style.display = 'none';
    pConv.innerHTML = ''; mConv.textContent = '';
    r ? loadRaster(file) : loadSvg(file);
  }

  function loadRaster(file) {
    const rd = new FileReader();
    rd.onload = e => {
      const img = new Image();
      img.onload = () => {
        srcImg = img; natW = img.naturalWidth; natH = img.naturalHeight;
        const c = document.createElement('canvas'); c.width = natW; c.height = natH;
        c.getContext('2d').drawImage(img, 0, 0);
        srcData = c.getContext('2d').getImageData(0, 0, natW, natH);
        showSource();
      };
      img.src = e.target.result;
    };
    rd.readAsDataURL(file);
  }

  function loadSvg(file) {
    const rd = new FileReader();
    rd.onload = e => {
      srcImg = e.target.result;
      const doc = new DOMParser().parseFromString(srcImg, 'image/svg+xml');
      const s = doc.querySelector('svg');
      const vb = s?.getAttribute('viewBox')?.split(/\s+/).map(Number);
      natW = Math.round(parseFloat(s?.getAttribute('width')) || vb?.[2] || 800);
      natH = Math.round(parseFloat(s?.getAttribute('height')) || vb?.[3] || 600);
      sW.max = Math.min(natW * 4, 4096);
      sW.value = Math.min(natW * 2, 2048);
      vW.textContent = sW.value + 'px';
      showSource();
    };
    rd.readAsText(file);
  }

  function showSource() {
    ctrls.classList.add('show'); previews.classList.add('show'); actions.classList.add('show');
    bConvert.disabled = false;
    pOrig.innerHTML = ''; mOrig.textContent = `${natW}×${natH}`;
    if (mode === 'r2s') {
      const img = srcImg.cloneNode(); img.style.cssText = 'max-width:100%;max-height:100%';
      pOrig.appendChild(img);
    } else {
      const d = document.createElement('div'); d.innerHTML = srcImg;
      const s = d.querySelector('svg');
      if (s) { s.style.cssText = 'max-width:100%;max-height:100%'; pOrig.appendChild(s); }
    }
    dz.style.display = 'none';
  }

  // ── Convert ──
  bConvert.addEventListener('click', () => mode === 'r2s' ? convertR2S() : convertS2R());

  function convertR2S() {
    if (!srcData) return;
    if (typeof ImageTracer === 'undefined') { notify('ImageTracer library not loaded', 'err'); return; }
    loading('Tracing vectors…');
    requestAnimationFrame(() => setTimeout(() => {
      try {
        const preset = xPreset.value;
        let opts;
        if (preset) {
          opts = preset;
        } else {
          opts = {
            numberofcolors: +sColors.value,
            ltres: +sLtres.value / 10,
            qtres: +sQtres.value / 10,
            pathomit: 4,
            colorsampling: 2,
            mincolorratio: 0,
            colorquantcycles: 3,
            blurradius: 0,
            blurdelta: 20,
            strokewidth: 0,
            linefilter: false,
            roundcoords: 2,
            desc: false,
            viewbox: true,
          };
        }
        const svg = ImageTracer.imagedataToSVG(srcData, opts);
        result = svg;
        pConv.innerHTML = '';
        const d = document.createElement('div'); d.innerHTML = svg;
        const s = d.querySelector('svg');
        if (s) { s.style.cssText = 'max-width:100%;max-height:100%'; pConv.appendChild(s); }
        mConv.textContent = `SVG · ${(new Blob([svg]).size / 1024).toFixed(1)} KB`;
        bDl.style.display = ''; loaded(); notify('Conversion complete', 'ok');
      } catch (err) { loaded(); notify('Failed: ' + err.message, 'err'); console.error(err); }
    }, 60));
  }

  function convertS2R() {
    if (!srcImg) return;
    loading('Rendering raster…');
    const tw = +sW.value, sc = tw / natW, th = Math.round(natH * sc);
    const fmt = xFmt.value, q = +sQ.value / 100;
    const blob = new Blob([srcImg], { type: 'image/svg+xml' }), url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = tw; c.height = th;
      const ctx = c.getContext('2d');
      if (fmt === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, tw, th); }
      ctx.drawImage(img, 0, 0, tw, th); URL.revokeObjectURL(url);
      c.toBlob(b => {
        if (blobUrl) URL.revokeObjectURL(blobUrl);
        blobUrl = URL.createObjectURL(b); result = b;
        pConv.innerHTML = '';
        const p = new Image(); p.src = blobUrl; p.style.cssText = 'max-width:100%;max-height:100%';
        pConv.appendChild(p);
        mConv.textContent = `${tw}×${th} · ${(b.size / 1024).toFixed(1)} KB`;
        bDl.style.display = ''; loaded(); notify('Conversion complete', 'ok');
      }, fmt, q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); loaded(); notify('Failed to render SVG', 'err'); };
    img.src = url;
  }

  // ── Download ──
  bDl.addEventListener('click', () => {
    if (!result) return;
    const a = document.createElement('a');
    const base = srcFile?.name?.replace(/\.[^.]+$/, '') || 'converted';
    if (mode === 'r2s') {
      a.href = URL.createObjectURL(new Blob([result], { type: 'image/svg+xml' }));
      a.download = base + '.svg';
    } else {
      a.href = blobUrl;
      a.download = base + ({ 'image/png': '.png', 'image/jpeg': '.jpg', 'image/webp': '.webp' }[xFmt.value]);
    }
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    notify('Downloaded', 'ok');
  });

  // ── Reset ──
  bReset.addEventListener('click', reset);
  function reset() {
    srcFile = srcImg = srcData = result = null;
    if (blobUrl) URL.revokeObjectURL(blobUrl); blobUrl = null;
    pOrig.innerHTML = ''; pConv.innerHTML = '';
    mOrig.textContent = ''; mConv.textContent = ''; fname.textContent = '';
    ctrls.classList.remove('show'); previews.classList.remove('show'); actions.classList.remove('show');
    bConvert.disabled = true; bDl.style.display = 'none'; dz.style.display = ''; fi.value = '';
  }

  // ── Sliders ──
  sColors.oninput = () => { vColors.textContent = sColors.value; xPreset.value = ''; };
  sLtres.oninput = () => { vLtres.textContent = (+sLtres.value / 10).toFixed(1); xPreset.value = ''; };
  sQtres.oninput = () => { vQtres.textContent = (+sQtres.value / 10).toFixed(1); xPreset.value = ''; };
  sW.oninput = () => { vW.textContent = sW.value + 'px'; };
  sQ.oninput = () => { vQ.textContent = sQ.value + '%'; };

  // ── Helpers ──
  function loading(t) { ovTxt.textContent = t; ov.classList.add('show'); }
  function loaded() { ov.classList.remove('show'); }
  let tt;
  function notify(m, cls) {
    clearTimeout(tt);
    toast.textContent = m; toast.className = 'toast ' + (cls || '') + ' show';
    tt = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  syncMode();
})();
</script>
</body>
</html>
