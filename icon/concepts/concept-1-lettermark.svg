<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="204" ry="204" fill="url(#bg)"/>

  <!-- Subtle top shine overlay -->
  <rect x="0" y="0" width="1024" height="512" rx="204" ry="204" fill="url(#shine)"/>

  <!-- Bold geometric T lettermark -->
  <g fill="#ffffff">
    <!-- Horizontal bar of T -->
    <rect x="192" y="220" width="640" height="136" rx="32" ry="32"/>
    <!-- Vertical stem of T -->
    <rect x="412" y="220" width="200" height="564" rx="32" ry="32"/>
  </g>

  <!-- Subtle accent notch on the T crossbar ends -->
  <rect x="192" y="324" width="152" height="32" rx="16" ry="16" fill="#a78bfa" opacity="0.35"/>
  <rect x="680" y="324" width="152" height="32" rx="16" ry="16" fill="#a78bfa" opacity="0.35"/>
</svg>
