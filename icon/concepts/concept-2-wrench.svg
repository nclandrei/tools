<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!--
      Wrench shape mask: white = visible, black = cut out.
      Local coordinate space: head at top (negative Y), handle at bottom (positive Y).
    -->
    <mask id="wrench-mask">
      <!-- Black base — nothing visible by default -->
      <rect x="-220" y="-420" width="440" height="760" fill="black"/>

      <!-- Shaft: tall pill connecting head to handle -->
      <rect x="-44" y="-160" width="88" height="460" rx="44" fill="white"/>

      <!-- Head: large circle forming the wrench head -->
      <circle cx="0" cy="-200" r="130" fill="white"/>

      <!-- Cut: hollow out the head center (open-end wrench ring) -->
      <circle cx="0" cy="-200" r="64" fill="black"/>

      <!-- Cut: jaw opening — slot from ring to outside of head -->
      <rect x="-28" y="-380" width="56" height="160" fill="black"/>

      <!-- Handle end: rounded bulge -->
      <circle cx="0" cy="300" r="56" fill="white"/>
    </mask>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="192" fill="url(#bg)"/>

  <!-- Subtle inner glow highlight -->
  <rect width="1024" height="1024" rx="192" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.2"/>

  <!-- Wrench shape: white fill masked into wrench form, rotated -45deg -->
  <g transform="translate(512,512) rotate(-45)">
    <rect x="-220" y="-420" width="440" height="760" fill="white" mask="url(#wrench-mask)"/>
  </g>
</svg>
