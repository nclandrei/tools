<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DOCX → PDF Converter</title>

<!-- Libraries (all from cdnjs, no npm) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface-2: #1e2026;
    --border: #2a2d35;
    --text: #e4e6eb;
    --text-dim: #8b8f9a;
    --accent: #4a7cff;
    --accent-glow: rgba(74, 124, 255, 0.15);
    --green: #34d399;
    --red: #f87171;
    --orange: #fbbf24;
    --radius: 12px;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    min-height: 100dvh;
  }

  .app {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header { text-align: center; padding: 20px 0 8px; }
  .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 0.85rem; color: var(--text-dim); }

  .badges { display: flex; justify-content: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 500;
    padding: 4px 10px; border-radius: 20px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  }

  .lib-status {
    text-align: center; font-size: 0.75rem; color: var(--red);
    padding: 8px 12px; background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2); border-radius: 8px;
  }

  .drop-zone {
    position: relative; border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 48px 24px; text-align: center; cursor: pointer;
    transition: all 0.25s ease; background: var(--surface); overflow: hidden;
  }
  .drop-zone::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--surface-2); }
  .drop-zone:hover::before, .drop-zone.drag-over::before { opacity: 1; }
  .drop-zone.drag-over { transform: scale(1.01); }

  .drop-icon {
    width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; transition: all 0.25s ease;
  }
  .drop-zone:hover .drop-icon { background: var(--accent-glow); border-color: var(--accent); }
  .drop-icon svg { width: 22px; height: 22px; color: var(--text-dim); transition: color 0.25s ease; }
  .drop-zone:hover .drop-icon svg { color: var(--accent); }

  .drop-text { font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; }
  .drop-hint { font-size: 0.8rem; color: var(--text-dim); }
  .drop-zone input[type="file"] { display: none; }

  .queue { display: flex; flex-direction: column; gap: 8px; }

  .file-card {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .file-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
    font-weight: 600; text-transform: uppercase; flex-shrink: 0;
  }
  .file-icon.docx { background: #1e3a5f; color: #60a5fa; }

  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

  .file-status { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.pending { background: var(--orange); }
  .status-dot.working { background: var(--accent); animation: pulse 1s infinite; }
  .status-dot.done    { background: var(--green); }
  .status-dot.error   { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  .status-label { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); }

  .btn-download {
    background: none; border: 1px solid var(--green); color: var(--green);
    font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 600;
    padding: 5px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-download:hover { background: var(--green); color: var(--bg); }

  .btn-remove {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    padding: 4px; border-radius: 4px; transition: color 0.2s; font-size: 1.1rem; line-height: 1;
  }
  .btn-remove:hover { color: var(--red); }

  .actions { display: flex; gap: 8px; }
  .btn-convert {
    flex: 1; padding: 14px 24px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-convert:hover:not(:disabled) { background: #5d8bff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(74,124,255,0.3); }
  .btn-convert:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-clear {
    padding: 14px 18px; background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s ease;
  }
  .btn-clear:hover { color: var(--red); border-color: var(--red); }

  .progress-bar { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: -8px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; width: 0%; }

  .footer { text-align: center; font-size: 0.72rem; color: var(--text-dim); opacity: 0.6; padding: 12px 0; }
  .hidden { display: none !important; }

  @media (pointer: coarse) {
    .drop-zone { padding: 56px 24px; }
    .btn-convert { padding: 16px 24px; font-size: 1rem; }
    .btn-download { padding: 8px 16px; }
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface-2); border: 1px solid var(--red); color: var(--text);
    font-size: 0.82rem; padding: 10px 20px; border-radius: 8px;
    opacity: 0; transition: all 0.35s ease; z-index: 100; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #renderContainer {
    position: absolute; left: -9999px; top: 0;
    width: 794px; background: white; z-index: -1; pointer-events: none;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>DOCX <span>→</span> PDF</h1>
    <p>Convert Word documents to PDF right in your browser</p>
    <div class="badges">
      <span class="badge">.docx</span>
    </div>
  </div>

  <div class="lib-status hidden" id="libStatus"></div>

  <div class="drop-zone" id="dropZone">
    <div class="drop-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
      </svg>
    </div>
    <div class="drop-text">Drop files here or tap to browse</div>
    <div class="drop-hint">.docx — all processing happens locally</div>
    <input type="file" id="fileInput" multiple accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
  </div>

  <div class="progress-bar hidden" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="queue" id="queue"></div>

  <div class="actions hidden" id="actions">
    <button class="btn-convert" id="btnConvert">Convert All to PDF</button>
    <button class="btn-clear" id="btnClear">Clear</button>
  </div>
</div>

<div class="footer">100% client-side · no uploads · no servers</div>
<div class="toast" id="toast"></div>
<div id="renderContainer"></div>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const dropZone = $('dropZone'), fileInput = $('fileInput'), queue = $('queue');
  const actions = $('actions'), btnConvert = $('btnConvert'), btnClear = $('btnClear');
  const progressBar = $('progressBar'), progressFill = $('progressFill');
  const toastEl = $('toast'), libStatus = $('libStatus');
  const renderContainer = $('renderContainer');

  const VALID_EXT = ['.docx'];
  let files = [];

  /* ── Library check ── */
  function checkLibraries() {
    const missing = [];
    if (typeof mammoth === 'undefined') missing.push('mammoth');
    if (typeof window.jspdf === 'undefined') missing.push('jspdf');
    if (typeof html2canvas === 'undefined') missing.push('html2canvas');
    if (missing.length) {
      libStatus.textContent = 'Could not load: ' + missing.join(', ') + '. Check your connection or ad-blocker.';
      libStatus.classList.remove('hidden');
      return false;
    }
    libStatus.classList.add('hidden');
    return true;
  }
  window.addEventListener('load', () => setTimeout(checkLibraries, 600));

  /* ── Helpers ── */
  const uid = () => Math.random().toString(36).slice(2, 10);
  const humanSize = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';
  const getExt = n => { const m = n.match(/\.(\w+)$/); return m ? '.'+m[1].toLowerCase() : ''; };
  const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 4000);
  }

  /* ── Drop zone ── */
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });

  function handleFiles(list) {
    let n = 0;
    for (const f of list) {
      const ext = getExt(f.name);
      if (!VALID_EXT.includes(ext)) { toast('Unsupported: ' + f.name); continue; }
      files.push({ id: uid(), file: f, name: f.name, size: f.size, ext, status: 'pending', blob: null });
      n++;
    }
    if (n) render();
  }

  /* ── Render queue ── */
  function render() {
    queue.innerHTML = '';
    files.forEach(f => {
      const card = document.createElement('div');
      card.className = 'file-card';
      const extCls = f.ext.replace('.','');
      const label = {pending:'ready',working:'converting…',done:'done',error:'failed'}[f.status];
      card.innerHTML =
        '<div class="file-icon '+extCls+'">'+extCls+'</div>'+
        '<div class="file-info"><div class="file-name">'+esc(f.name)+'</div><div class="file-meta">'+humanSize(f.size)+'</div></div>'+
        '<div class="file-status">'+
        (f.status==='done'?'<button class="btn-download" data-id="'+f.id+'">Save PDF</button>':'<span class="status-dot '+f.status+'"></span><span class="status-label">'+label+'</span>')+
        '<button class="btn-remove" data-id="'+f.id+'" title="Remove">&times;</button></div>';
      queue.appendChild(card);
    });
    queue.querySelectorAll('.btn-download').forEach(b => b.onclick = () => downloadPdf(b.dataset.id));
    queue.querySelectorAll('.btn-remove').forEach(b => b.onclick = () => { files = files.filter(f=>f.id!==b.dataset.id); render(); });
    actions.classList.toggle('hidden', !files.length);
    const hasPending = files.some(f => f.status === 'pending');
    btnConvert.disabled = !hasPending;
    btnConvert.textContent = hasPending ? 'Convert All to PDF' : 'All Done ✓';
  }

  /* ── Convert all ── */
  btnConvert.addEventListener('click', convertAll);
  btnClear.addEventListener('click', () => { files = []; render(); });

  async function convertAll() {
    if (!checkLibraries()) { toast('Libraries not loaded.'); return; }
    const pending = files.filter(f => f.status === 'pending');
    if (!pending.length) return;
    btnConvert.disabled = true;
    progressBar.classList.remove('hidden');

    for (let i = 0; i < pending.length; i++) {
      const f = pending[i];
      f.status = 'working'; render();
      progressFill.style.width = ((i/pending.length)*100)+'%';
      try {
        f.blob = await convertDocxToPdf(f.file);
        f.status = 'done';
      } catch(err) {
        console.error('Conversion error ('+f.name+'):', err);
        f.status = 'error';
        toast('Failed: '+f.name+' — '+(err.message||'unknown'));
      }
      render();
    }
    progressFill.style.width = '100%';
    setTimeout(() => { progressBar.classList.add('hidden'); progressFill.style.width = '0%'; }, 800);
  }

  /* ─────────────────────────────────────────────
     DOCX → PDF  (mammoth → html2canvas → jsPDF)
     ───────────────────────────────────────────── */
  async function convertDocxToPdf(file) {
    const ab = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({ arrayBuffer: ab });
    const html = result.value;
    if (!html || !html.trim()) throw new Error('Empty or unreadable document');

    // Render HTML into hidden container
    renderContainer.innerHTML = '';
    Object.assign(renderContainer.style, {
      width: '794px', padding: '60px 64px', background: '#fff',
      fontFamily: 'Georgia, "Times New Roman", serif',
      fontSize: '12pt', lineHeight: '1.65', color: '#111',
    });

    const style = document.createElement('style');
    style.textContent = `
      #renderContainer h1 { font-size:22pt; margin:20px 0 10px; font-weight:700; }
      #renderContainer h2 { font-size:17pt; margin:18px 0 8px; font-weight:700; }
      #renderContainer h3 { font-size:14pt; margin:14px 0 6px; font-weight:700; }
      #renderContainer h4 { font-size:12pt; margin:12px 0 6px; font-weight:700; }
      #renderContainer p  { margin:0 0 10px; orphans:3; widows:3; }
      #renderContainer ul, #renderContainer ol { margin:0 0 10px; padding-left:28px; }
      #renderContainer li { margin:0 0 4px; }
      #renderContainer table { border-collapse:collapse; width:100%; margin:12px 0; }
      #renderContainer td, #renderContainer th { border:1px solid #999; padding:6px 10px; font-size:10pt; }
      #renderContainer th { background:#eee; font-weight:bold; }
      #renderContainer img { max-width:100%; height:auto; }
      #renderContainer strong, #renderContainer b { font-weight:bold; }
      #renderContainer em, #renderContainer i { font-style:italic; }
    `;
    renderContainer.appendChild(style);

    const content = document.createElement('div');
    content.innerHTML = html.replace(/<script[\s\S]*?<\/script>/gi,'')
                            .replace(/on\w+\s*=\s*["'][^"']*["']/gi,'');
    renderContainer.appendChild(content);

    // Wait for images
    await Promise.allSettled(
      Array.from(renderContainer.querySelectorAll('img')).map(img =>
        img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })
      )
    );

    // Capture to canvas
    const canvas = await html2canvas(renderContainer, {
      scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff',
      width: 794, windowWidth: 794,
    });
    renderContainer.innerHTML = '';

    // Paginate into A4 PDF
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('portrait', 'mm', 'a4');
    const pageW = 210, pageH = 297;
    const canvasW = canvas.width, canvasH = canvas.height;
    const mmPerPx = pageW / canvasW;
    const pxPerPage = pageH / mmPerPx;
    const totalPages = Math.ceil(canvasH / pxPerPage);

    for (let p = 0; p < totalPages; p++) {
      if (p > 0) pdf.addPage();
      const srcY = p * pxPerPage;
      const sliceH = Math.min(pxPerPage, canvasH - srcY);

      const slice = document.createElement('canvas');
      slice.width = canvasW;
      slice.height = sliceH;
      const ctx = slice.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvasW, sliceH);
      ctx.drawImage(canvas, 0, srcY, canvasW, sliceH, 0, 0, canvasW, sliceH);

      pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pageW, sliceH * mmPerPx);
    }

    return pdf.output('blob');
  }

  /* ── Download (iOS-friendly) ── */
  async function downloadPdf(id) {
    const f = files.find(x => x.id === id);
    if (!f?.blob) return;
    const name = f.name.replace(/\.\w+$/, '') + '.pdf';
    const pdfFile = new File([f.blob], name, { type: 'application/pdf' });

    // 1) Web Share API (iOS 15+ → native share sheet → Save to Files)
    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      try {
        await navigator.share({ files: [pdfFile], title: name });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }

    // 2) iOS fallback: open in new tab (Safari renders PDF with share button)
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) {
      const url = URL.createObjectURL(f.blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast('PDF opened — tap the share icon to save');
      return;
    }

    // 3) Desktop: standard <a download>
    const url = URL.createObjectURL(f.blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  render();
})();
</script>
</body>
</html>
