<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Compressor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-hover: #1c1c1f;
      --border: #2a2a2e;
      --text: #e4e4e7;
      --text-dim: #71717a;
      --accent: #a78bfa;
      --accent-hover: #8b5cf6;
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
      --radius: 12px;
      --radius-sm: 8px;
      --font: 'DM Sans', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2.5rem; animation: fadeUp .4s ease; }
    h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: .4rem; }
    .subtitle { color: var(--text-dim); font-size: .95rem; }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all .15s ease;
      position: relative;
      animation: fadeUp .4s ease .05s both;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(167,139,250,.05);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .drop-zone p { color: var(--text-dim); font-size: .95rem; }
    .drop-icon { font-size: 2rem; margin-bottom: .75rem; color: var(--text-dim); line-height: 1; }

    .file-list {
      display: flex; flex-direction: column; gap: .75rem;
      margin-top: 1.5rem;
    }

    .file-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
      animation: fadeUp .3s ease;
    }
    .file-top {
      display: flex; align-items: center; gap: 1rem;
    }
    .file-item img.thumb {
      width: 64px; height: 64px; object-fit: cover;
      border-radius: var(--radius-sm); background: #000; flex-shrink: 0;
    }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-weight: 500; margin-bottom: .2rem; word-break: break-all; font-size: .95rem; }
    .file-meta { color: var(--text-dim); font-family: var(--mono); font-size: .8rem; }
    .file-meta .savings { color: var(--green); }
    .file-meta .increase { color: var(--red); }
    .file-remove {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      width: 32px; height: 32px; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; transition: all .15s ease; flex-shrink: 0;
    }
    .file-remove:hover { border-color: var(--red); color: var(--red); }

    .controls {
      display: grid; grid-template-columns: 1fr 1fr; gap: .75rem;
      margin-top: .75rem; padding-top: .75rem;
      border-top: 1px solid var(--border);
    }

    .control-group { display: flex; flex-direction: column; gap: .3rem; }
    .control-group label {
      font-size: .8rem; color: var(--text-dim); font-weight: 500;
    }
    .control-group select,
    .control-group input[type="number"] {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      font-family: var(--font); font-size: .85rem; padding: .45rem .6rem;
      border-radius: var(--radius-sm); outline: none;
      transition: border-color .15s ease;
    }
    .control-group select:focus,
    .control-group input[type="number"]:focus {
      border-color: var(--accent);
    }

    .quality-row {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: .75rem;
    }
    .quality-row label { font-size: .8rem; color: var(--text-dim); font-weight: 500; white-space: nowrap; }
    .quality-row input[type="range"] {
      flex: 1; accent-color: var(--accent); height: 4px;
    }
    .quality-row .quality-val {
      font-family: var(--mono); font-size: .85rem; color: var(--text);
      min-width: 2.5rem; text-align: right;
    }

    .resize-row {
      grid-column: 1 / -1;
      display: flex; align-items: end; gap: .75rem;
    }
    .resize-row .control-group { flex: 1; }
    .link-btn {
      background: none; border: 1px solid var(--border); color: var(--accent);
      width: 32px; height: 34px; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; transition: all .15s ease; flex-shrink: 0;
      margin-bottom: 1px;
    }
    .link-btn.linked { border-color: var(--accent); background: rgba(167,139,250,.1); }
    .link-btn:hover { border-color: var(--accent); }

    .actions {
      margin-top: 1.5rem;
      display: flex; gap: .75rem; flex-wrap: wrap;
      animation: fadeUp .3s ease;
    }

    .btn {
      font-family: var(--font); font-size: .9rem; font-weight: 500;
      padding: .6rem 1.25rem; border-radius: var(--radius-sm);
      cursor: pointer; transition: all .15s ease; border: none;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    .btn-secondary:hover { border-color: var(--text-dim); }

    .global-controls {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
      margin-top: 1.5rem; animation: fadeUp .3s ease;
    }
    .global-controls h3 {
      font-size: .85rem; font-weight: 500; color: var(--text-dim);
      margin-bottom: .75rem; text-transform: uppercase; letter-spacing: .03em;
    }

    .results-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
      margin-top: 1rem; text-align: center;
      font-family: var(--mono); font-size: .85rem;
      animation: fadeUp .3s ease;
    }
    .results-bar .savings { color: var(--green); font-weight: 600; }
    .results-bar .increase { color: var(--red); font-weight: 600; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
      .resize-row { flex-wrap: wrap; }
      .actions { flex-direction: column; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Image Compressor</h1>
      <p class="subtitle">Resize, adjust quality, convert between PNG / JPEG / WebP</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <input type="file" accept="image/png,image/jpeg,image/webp" multiple id="fileInput">
      <div class="drop-icon">&#128444;</div>
      <p>Drop images here or click to browse</p>
      <p style="font-size:.8rem;color:var(--text-dim);margin-top:.3rem;">PNG, JPEG, WebP</p>
    </div>

    <div class="global-controls" id="globalControls" style="display:none;">
      <h3>Settings</h3>
      <div class="controls" style="margin-top:0;padding-top:0;border-top:none;">
        <div class="control-group">
          <label>Output format</label>
          <select id="globalFormat">
            <option value="auto">Same as original</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
        <div class="control-group">
          <label>Max dimension (px)</label>
          <input type="number" id="globalMaxDim" placeholder="No limit" min="1" max="16384">
        </div>
        <div class="quality-row">
          <label>Quality</label>
          <input type="range" id="globalQuality" min="1" max="100" value="80">
          <span class="quality-val" id="globalQualityVal">80%</span>
        </div>
      </div>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="actions" id="actions" style="display:none;">
      <button class="btn btn-primary" id="compressBtn">Compress all</button>
      <button class="btn btn-secondary" id="downloadAllBtn" style="display:none;">Download all</button>
      <button class="btn btn-secondary" id="clearBtn">Clear</button>
    </div>

    <div class="results-bar" id="resultsBar" style="display:none;"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const globalControls = document.getElementById('globalControls');
    const actions = document.getElementById('actions');
    const compressBtn = document.getElementById('compressBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultsBar = document.getElementById('resultsBar');
    const globalFormat = document.getElementById('globalFormat');
    const globalMaxDim = document.getElementById('globalMaxDim');
    const globalQuality = document.getElementById('globalQuality');
    const globalQualityVal = document.getElementById('globalQualityVal');

    let items = [];

    globalQuality.addEventListener('input', () => {
      globalQualityVal.textContent = globalQuality.value + '%';
    });

    // Drop zone
    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, ev => {
      ev.preventDefault(); dropZone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => {
      dropZone.classList.remove('dragover');
    }));
    dropZone.addEventListener('drop', ev => {
      ev.preventDefault();
      addFiles(ev.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });

    function addFiles(files) {
      for (const f of files) {
        if (!f.type.match(/^image\/(png|jpeg|webp)$/)) continue;
        const item = {
          id: crypto.randomUUID(),
          file: f,
          originalSize: f.size,
          compressed: null,
          compressedSize: null,
        };
        items.push(item);
        renderItem(item);
      }
      updateUI();
    }

    function renderItem(item) {
      const el = document.createElement('div');
      el.className = 'file-item';
      el.id = 'item-' + item.id;

      const url = URL.createObjectURL(item.file);
      const img = new Image();
      img.onload = () => {
        item.naturalWidth = img.naturalWidth;
        item.naturalHeight = img.naturalHeight;
        const dimEl = el.querySelector('.dims');
        if (dimEl) dimEl.textContent = img.naturalWidth + ' × ' + img.naturalHeight;
      };
      img.src = url;

      el.innerHTML = `
        <div class="file-top">
          <img class="thumb" src="${url}" alt="">
          <div class="file-info">
            <div class="file-name">${esc(item.file.name)}</div>
            <div class="file-meta">
              <span class="dims">…</span> &middot; ${formatBytes(item.originalSize)} &middot; ${formatType(item.file.type)}
              <span class="result-info"></span>
            </div>
          </div>
          <button class="file-remove" data-id="${item.id}">&times;</button>
        </div>
      `;

      el.querySelector('.file-remove').addEventListener('click', () => removeItem(item.id));
      fileList.appendChild(el);
    }

    function removeItem(id) {
      items = items.filter(i => i.id !== id);
      const el = document.getElementById('item-' + id);
      if (el) el.remove();
      updateUI();
    }

    function updateUI() {
      const hasItems = items.length > 0;
      globalControls.style.display = hasItems ? '' : 'none';
      actions.style.display = hasItems ? '' : 'none';
      if (!hasItems) {
        resultsBar.style.display = 'none';
        downloadAllBtn.style.display = 'none';
      }
    }

    clearBtn.addEventListener('click', () => {
      items = [];
      fileList.innerHTML = '';
      updateUI();
    });

    compressBtn.addEventListener('click', async () => {
      compressBtn.disabled = true;
      compressBtn.textContent = 'Compressing…';
      downloadAllBtn.style.display = 'none';
      resultsBar.style.display = 'none';

      const format = globalFormat.value;
      const quality = parseInt(globalQuality.value) / 100;
      const maxDim = globalMaxDim.value ? parseInt(globalMaxDim.value) : null;

      let totalOriginal = 0;
      let totalCompressed = 0;

      for (const item of items) {
        try {
          const result = await compressImage(item.file, format, quality, maxDim);
          item.compressed = result.blob;
          item.compressedSize = result.blob.size;
          item.outputWidth = result.width;
          item.outputHeight = result.height;
          totalOriginal += item.originalSize;
          totalCompressed += item.compressedSize;
          updateItemResult(item);
        } catch (err) {
          console.error('Compress failed for', item.file.name, err);
        }
      }

      // Show results
      if (totalOriginal > 0) {
        const diff = totalOriginal - totalCompressed;
        const pct = ((diff / totalOriginal) * 100).toFixed(1);
        if (diff >= 0) {
          resultsBar.innerHTML = `${formatBytes(totalOriginal)} → ${formatBytes(totalCompressed)} &middot; <span class="savings">saved ${formatBytes(diff)} (${pct}%)</span>`;
        } else {
          resultsBar.innerHTML = `${formatBytes(totalOriginal)} → ${formatBytes(totalCompressed)} &middot; <span class="increase">+${formatBytes(-diff)} larger</span>`;
        }
        resultsBar.style.display = '';
      }

      downloadAllBtn.style.display = '';
      compressBtn.disabled = false;
      compressBtn.textContent = 'Compress all';
    });

    function updateItemResult(item) {
      const el = document.getElementById('item-' + item.id);
      if (!el) return;
      const info = el.querySelector('.result-info');
      const diff = item.originalSize - item.compressedSize;
      const pct = ((diff / item.originalSize) * 100).toFixed(1);
      if (diff >= 0) {
        info.innerHTML = ` → ${formatBytes(item.compressedSize)} <span class="savings">−${pct}%</span>`;
      } else {
        info.innerHTML = ` → ${formatBytes(item.compressedSize)} <span class="increase">+${Math.abs(pct)}%</span>`;
      }
    }

    function compressImage(file, format, quality, maxDim) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let w = img.naturalWidth;
          let h = img.naturalHeight;

          if (maxDim && (w > maxDim || h > maxDim)) {
            if (w >= h) {
              h = Math.round(h * (maxDim / w));
              w = maxDim;
            } else {
              w = Math.round(w * (maxDim / h));
              h = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const outputFormat = format === 'auto' ? file.type : format;
          const useQuality = outputFormat === 'image/png' ? undefined : quality;

          canvas.toBlob(blob => {
            if (blob) resolve({ blob, width: w, height: h });
            else reject(new Error('toBlob returned null'));
          }, outputFormat, useQuality);
        };
        img.onerror = () => reject(new Error('Failed to load image'));
        img.src = URL.createObjectURL(file);
      });
    }

    downloadAllBtn.addEventListener('click', () => {
      const compressed = items.filter(i => i.compressed);
      if (compressed.length === 1) {
        downloadBlob(compressed[0].compressed, outputName(compressed[0]));
        return;
      }
      for (const item of compressed) {
        downloadBlob(item.compressed, outputName(item));
      }
    });

    function outputName(item) {
      const format = globalFormat.value;
      const baseName = item.file.name.replace(/\.[^.]+$/, '');
      const ext = format === 'auto' ? getExt(item.file.type) : getExt(format);
      return baseName + '_compressed.' + ext;
    }

    function getExt(mime) {
      if (mime === 'image/jpeg') return 'jpg';
      if (mime === 'image/png') return 'png';
      if (mime === 'image/webp') return 'webp';
      return 'bin';
    }

    function downloadBlob(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      return (b / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function formatType(t) {
      return t.replace('image/', '').toUpperCase();
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
