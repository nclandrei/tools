<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plate Calculator</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  [data-theme="light"] {
    --plate-accent: #b8960a;
    --plate-accent-dim: rgba(184, 150, 10, 0.08);
    --plate-green: #16a34a;
    --plate-red: #dc2626;
  }
  [data-theme="dark"] {
    --plate-accent: #e8c44a;
    --plate-accent-dim: rgba(232, 196, 74, 0.12);
    --plate-green: #34d399;
    --plate-red: #f87171;
  }

  .container {
    max-width: 400px;
  }

  /* Target weight input */
  .target-section {
    margin-bottom: 1.5rem;
  }

  .target-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .target-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }

  .target-input-wrap {
    flex: 1;
    position: relative;
  }

  .target-input-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.8rem;
    font-weight: 700;
    padding: 0.5rem 0.8rem;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  .target-input-wrap input::-webkit-inner-spin-button,
  .target-input-wrap input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .target-input-wrap input:focus { border-color: var(--plate-accent); background: var(--plate-accent-dim); }

  .target-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .adj-btn {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  .adj-btn:active { background: var(--plate-accent-dim); border-color: var(--plate-accent); }

  /* Bar weight toggle */
  .bar-section {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .bar-option {
    flex: 1;
    background: var(--surface);
    border: none;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 0.55rem 0.4rem;
    cursor: pointer;
    text-align: center;
    transition: background 0.1s, color 0.1s;
    text-transform: uppercase;
  }
  .bar-option.active {
    background: var(--plate-accent-dim);
    color: var(--plate-accent);
  }

  /* Unit toggle */
  .unit-section {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .unit-option {
    flex: 1;
    background: var(--surface);
    border: none;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 0.55rem 0.4rem;
    cursor: pointer;
    text-align: center;
    transition: background 0.1s, color 0.1s;
    text-transform: uppercase;
  }
  .unit-option.active {
    background: var(--plate-accent-dim);
    color: var(--plate-accent);
  }

  /* Quick-add plate buttons */
  .quick-section {
    margin-bottom: 1.5rem;
  }

  .quick-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  .quick-plates {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .quick-plate {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, border-color 0.1s;
    min-width: 44px;
    text-align: center;
  }
  .quick-plate:active { background: var(--plate-accent-dim); border-color: var(--plate-accent); }

  /* Barbell visual */
  .barbell-section {
    margin-bottom: 1.5rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .barbell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    padding: 0.5rem 0;
  }

  .bar-visual {
    height: 8px;
    background: #666;
    border-radius: 4px;
    min-width: 30px;
    flex-shrink: 0;
  }

  .collar {
    width: 6px;
    height: 22px;
    background: #555;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .plates-side {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .plates-left { flex-direction: row-reverse; }

  .plate-vis {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    margin: 0 1px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    flex-shrink: 0;
    writing-mode: vertical-lr;
    text-orientation: mixed;
  }

  /* Result */
  .result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    display: none;
  }
  .result.visible { display: block; }

  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--plate-green);
    margin-bottom: 0.75rem;
  }

  .plate-list {
    list-style: none;
  }

  .plate-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
  }
  .plate-row:last-child { border-bottom: none; }

  .plate-weight {
    font-size: 1rem;
    font-weight: 700;
  }

  .plate-count {
    font-size: 0.85rem;
    color: var(--plate-accent);
    font-weight: 600;
  }

  .plate-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 0.5rem;
    flex-shrink: 0;
  }

  .plate-info {
    display: flex;
    align-items: center;
  }

  .total-line {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    padding-top: 0.6rem;
    margin-top: 0.4rem;
    border-top: 1px solid var(--border);
  }
  .total-line strong { color: var(--text); }

  .error-msg {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--plate-red);
    padding: 0.5rem 0;
  }

  .note {
    margin-top: 1.5rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Plate Calculator</h1>
    <a href="/">← all tools</a>
  </header>
  <p class="desc">What to load on each side of the bar.</p>

  <!-- Unit toggle -->
  <div class="unit-section" id="unit-toggle">
    <button class="unit-option active" data-unit="kg" onclick="setUnit('kg')">KG</button>
    <button class="unit-option" data-unit="lb" onclick="setUnit('lb')">LB</button>
  </div>

  <!-- Bar weight -->
  <div class="quick-label">Bar</div>
  <div class="bar-section" id="bar-toggle"></div>

  <!-- Target weight -->
  <div class="target-section">
    <div class="target-label">Total weight</div>
    <div class="target-row">
      <button class="adj-btn" onclick="adjust(-step())" aria-label="Decrease">&minus;</button>
      <div class="target-input-wrap">
        <input type="number" id="target" min="0" step="2.5" value="60" inputmode="decimal" oninput="calc()">
      </div>
      <button class="adj-btn" onclick="adjust(+step())" aria-label="Increase">+</button>
    </div>
  </div>

  <!-- Quick-add plates -->
  <div class="quick-section">
    <div class="quick-label">Quick add (per side)</div>
    <div class="quick-plates" id="quick-plates"></div>
  </div>

  <!-- Barbell visualization -->
  <div class="barbell-section">
    <div class="barbell" id="barbell-vis"></div>
  </div>

  <!-- Result breakdown -->
  <div class="result" id="result"></div>

  <div class="note">
    Enter total weight. The calculator shows which plates to put on <strong>each side</strong> of the bar.
  </div>
</div>

<script>
  // Plate definitions per unit system
  const PLATES = {
    kg: [25, 20, 15, 10, 5, 2.5, 1.25],
    lb: [45, 35, 25, 10, 5, 2.5]
  };

  const BAR_WEIGHTS = {
    kg: [20, 15, 10],
    lb: [45, 35, 15]
  };

  // Plate colors (inspired by competition/gym plates)
  const PLATE_COLORS_KG = {
    25: '#c0392b',
    20: '#2980b9',
    15: '#e8c44a',
    10: '#27ae60',
    5:  '#eeeeee',
    2.5:'#1a1a1a',
    1.25:'#888888'
  };

  const PLATE_COLORS_LB = {
    45: '#2980b9',
    35: '#e8c44a',
    25: '#27ae60',
    10: '#eeeeee',
    5:  '#1a1a1a',
    2.5:'#888888'
  };

  // Plate visual heights
  const PLATE_HEIGHTS_KG = {
    25: 90, 20: 90, 15: 78, 10: 66, 5: 54, 2.5: 42, 1.25: 34
  };

  const PLATE_HEIGHTS_LB = {
    45: 90, 35: 82, 25: 74, 10: 58, 5: 46, 2.5: 38
  };

  let currentUnit = 'kg';
  let currentBar = 20;

  function step() {
    return currentUnit === 'kg' ? 2.5 : 5;
  }

  function setUnit(unit) {
    const prevUnit = currentUnit;
    currentUnit = unit;
    document.querySelectorAll('.unit-option').forEach(b => {
      b.classList.toggle('active', b.dataset.unit === unit);
    });
    // Convert current weight between units
    const input = document.getElementById('target');
    const val = parseFloat(input.value);
    if (val && prevUnit !== unit) {
      const converted = prevUnit === 'kg' ? val * 2.20462 : val / 2.20462;
      // Round to nearest step
      const s = unit === 'kg' ? 2.5 : 5;
      input.value = fmtNum(Math.round(converted / s) * s);
    }
    // Convert bar weight
    if (prevUnit !== unit) {
      const barConverted = prevUnit === 'kg' ? currentBar * 2.20462 : currentBar / 2.20462;
      const barWeights = BAR_WEIGHTS[unit];
      // Pick the closest available bar weight
      currentBar = barWeights.reduce((best, w) =>
        Math.abs(w - barConverted) < Math.abs(best - barConverted) ? w : best
      );
    }
    // Update bar options
    renderBarOptions();
    // Update quick plates
    renderQuickPlates();
    // Update input step
    input.step = step();
    calc();
  }

  function renderBarOptions() {
    const container = document.getElementById('bar-toggle');
    const weights = BAR_WEIGHTS[currentUnit];
    // Pick closest valid bar weight
    if (!weights.includes(currentBar)) {
      currentBar = weights[0];
    }
    const unit = currentUnit;
    container.innerHTML = weights.map(w =>
      `<button class="bar-option ${w === currentBar ? 'active' : ''}" onclick="setBar(${w})">${w} ${unit}</button>`
    ).join('');
  }

  function setBar(w) {
    currentBar = w;
    document.querySelectorAll('.bar-option').forEach(b => {
      b.classList.toggle('active', b.textContent.trim().startsWith(w + ''));
    });
    renderBarOptions();
    calc();
  }

  function renderQuickPlates() {
    const container = document.getElementById('quick-plates');
    const plates = PLATES[currentUnit];
    container.innerHTML = plates.map(p =>
      `<button class="quick-plate" onclick="quickAdd(${p})">+${fmtNum(p)}</button>`
    ).join('');
  }

  function quickAdd(plateWeight) {
    const input = document.getElementById('target');
    const current = parseFloat(input.value) || currentBar;
    // Add plate to both sides
    input.value = fmtNum(current + plateWeight * 2);
    calc();
  }

  function adjust(delta) {
    const input = document.getElementById('target');
    const current = parseFloat(input.value) || currentBar;
    const newVal = Math.max(0, current + delta);
    input.value = fmtNum(newVal);
    calc();
  }

  function fmtNum(n) {
    return n % 1 === 0 ? n.toString() : n.toFixed(n % 0.5 === 0 ? 1 : 2);
  }

  function calcPlates(perSide, availablePlates) {
    let remaining = perSide;
    const result = [];
    for (const plate of availablePlates) {
      const count = Math.floor(remaining / plate);
      if (count > 0) {
        result.push({ weight: plate, count });
        remaining = Math.round((remaining - plate * count) * 100) / 100;
      }
    }
    return { plates: result, remainder: remaining };
  }

  function getColors() {
    return currentUnit === 'kg' ? PLATE_COLORS_KG : PLATE_COLORS_LB;
  }

  function getHeights() {
    return currentUnit === 'kg' ? PLATE_HEIGHTS_KG : PLATE_HEIGHTS_LB;
  }

  function renderBarbell(plates) {
    const container = document.getElementById('barbell-vis');
    const colors = getColors();
    const heights = getHeights();

    // Build plate sequence (largest to smallest, repeated)
    const seq = [];
    for (const p of plates) {
      for (let i = 0; i < p.count; i++) {
        seq.push(p.weight);
      }
    }

    function makePlates(plateSeq) {
      return plateSeq.map(w => {
        const h = heights[w] || 50;
        const width = Math.max(14, 10 + Math.log2(w + 1) * 4);
        const color = colors[w] || '#666';
        const textColor = (w === 5 && currentUnit === 'kg') || (w === 10 && currentUnit === 'lb') ? '#333' : '#fff';
        const fontSize = h < 50 ? '0.5rem' : '0.6rem';
        return `<div class="plate-vis" style="height:${h}px;width:${width}px;background:${color};font-size:${fontSize};color:${textColor}">${fmtNum(w)}</div>`;
      }).join('');
    }

    const leftPlates = makePlates([...seq].reverse());
    const rightPlates = makePlates(seq);

    container.innerHTML = `
      <div class="plates-side plates-left">${leftPlates}</div>
      <div class="collar"></div>
      <div class="bar-visual" style="width: 60px"></div>
      <div class="collar"></div>
      <div class="plates-side">${rightPlates}</div>
    `;
  }

  function calc() {
    const target = parseFloat(document.getElementById('target').value);
    const resultEl = document.getElementById('result');
    const barbellEl = document.getElementById('barbell-vis');
    const unit = currentUnit;
    const colors = getColors();

    if (!target || target < 0) {
      resultEl.classList.remove('visible');
      barbellEl.innerHTML = '';
      return;
    }

    if (target < currentBar) {
      resultEl.classList.add('visible');
      resultEl.innerHTML = `<div class="error-msg">Target is less than bar weight (${currentBar} ${unit})</div>`;
      barbellEl.innerHTML = '';
      return;
    }

    if (target === currentBar) {
      resultEl.classList.add('visible');
      resultEl.innerHTML = `<div class="result-label">▸ Empty bar</div>
        <div class="total-line">Bar only: <strong>${currentBar} ${unit}</strong></div>`;
      renderBarbell([]);
      return;
    }

    const perSide = (target - currentBar) / 2;
    const { plates, remainder } = calcPlates(perSide, PLATES[unit]);

    if (remainder > 0.01) {
      const achievable = target - remainder * 2;
      resultEl.classList.add('visible');
      resultEl.innerHTML = `<div class="error-msg">Can't make exactly ${fmtNum(target)} ${unit}.</div>
        <div class="total-line">Closest: <strong>${fmtNum(achievable)} ${unit}</strong></div>`;
      // Still show plates for the achievable weight
      if (plates.length > 0) {
        renderBarbell(plates);
        const listHTML = plates.map(p =>
          `<div class="plate-row">
            <div class="plate-info"><span class="plate-swatch" style="background:${colors[p.weight] || '#666'}"></span>${fmtNum(p.weight)} ${unit}</div>
            <div class="plate-count">&times;${p.count} each side</div>
          </div>`
        ).join('');
        resultEl.innerHTML += `<ul class="plate-list" style="margin-top:0.75rem">${listHTML}</ul>`;
      }
      return;
    }

    // Success
    const listHTML = plates.map(p =>
      `<div class="plate-row">
        <div class="plate-info"><span class="plate-swatch" style="background:${colors[p.weight] || '#666'}"></span>${fmtNum(p.weight)} ${unit}</div>
        <div class="plate-count">&times;${p.count} each side</div>
      </div>`
    ).join('');

    const totalPlates = plates.reduce((sum, p) => sum + p.count * 2, 0);

    resultEl.classList.add('visible');
    resultEl.innerHTML = `
      <div class="result-label">▸ Per side</div>
      <ul class="plate-list">${listHTML}</ul>
      <div class="total-line">${totalPlates} plates total · Bar: <strong>${currentBar} ${unit}</strong></div>
    `;

    renderBarbell(plates);
  }

  // Init
  renderBarOptions();
  renderQuickPlates();
  calc();
</script>
</body>
</html>
