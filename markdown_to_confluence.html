<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Markdown → Confluence</title>

<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">

<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .header {
    padding: 20px 16px 12px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .btn-file { position: relative; overflow: hidden; }
  .btn-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

  .file-name {
    font-family: monospace;
    font-size: 0.72rem;
    color: var(--green);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .format-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .format-toggle button {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 7px 12px;
    border: none;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .format-toggle button + button { border-left: 1px solid var(--border); }
  .format-toggle button.active { background: var(--accent); color: #fff; }

  .tab-bar {
    display: none;
    padding: 0 16px 8px;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:first-child { border-radius: 8px 0 0 8px; }
  .tab-btn:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .editor-wrap {
    flex: 1;
    display: flex;
    gap: 0;
    padding: 0 16px 16px;
    min-height: 0;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .pane-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 8px 12px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pane:first-child .pane-label { border-radius: 12px 0 0 0; }
  .pane:last-child .pane-label { border-radius: 0 12px 0 0; border-left: none; }

  .pane-label .copy-btn {
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }
  .pane-label .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pane-label .copy-btn.copied { border-color: var(--green); color: var(--green); }

  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-top: none;
    background: var(--surface);
    color: var(--text);
    font-family: monospace;
    font-size: 0.82rem;
    line-height: 1.6;
    padding: 16px;
    outline: none;
    tab-size: 2;
    -moz-tab-size: 2;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .pane:first-child textarea { border-radius: 0 0 0 12px; }
  .pane:last-child textarea {
    border-left: none;
    border-radius: 0 0 12px 0;
    background: var(--surface-alt);
  }

  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .drop-overlay.active { display: flex; }
  .drop-overlay-inner {
    border: 2px dashed var(--accent);
    border-radius: 16px;
    padding: 48px 64px;
    text-align: center;
    background: var(--surface);
  }
  .drop-overlay-inner svg { width: 48px; height: 48px; color: var(--accent); margin-bottom: 12px; }
  .drop-overlay-inner p { font-size: 1rem; font-weight: 500; }
  .drop-overlay-inner span { font-size: 0.82rem; color: var(--text-muted); display: block; margin-top: 4px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface-alt); border: 1px solid var(--border); color: var(--text);
    font-size: 0.82rem; padding: 10px 20px; border-radius: 8px;
    opacity: 0; transition: all 0.35s ease; z-index: 200; max-width: 90vw; text-align: center;
  }
  .toast.error { border-color: var(--red); }
  .toast.success { border-color: var(--green); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    opacity: 0.6;
    padding: 8px 16px;
    flex-shrink: 0;
  }

  @media (max-width: 700px) {
    .tab-bar { display: flex; }
    .editor-wrap { flex-direction: column; }
    .pane-label { display: none; }
    .pane:first-child textarea,
    .pane:last-child textarea {
      border-radius: 0;
      border: 1px solid var(--border);
    }
    .pane.hidden-mobile { display: none; }
    .toolbar { justify-content: flex-start; }
  }

  @media (min-width: 701px) {
    .tab-bar { display: none !important; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="/">← all tools</a>
  <h1>Markdown <span>→</span> Confluence</h1>
  <p>Convert Markdown to Atlassian Confluence Storage Format or Wiki Markup</p>
</div>

<div class="toolbar">
  <label class="btn btn-secondary btn-file">
    Open .md
    <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.mkdn,.mdwn,.txt,text/markdown,text/plain">
  </label>
  <span class="file-name" id="fileName"></span>
  <div class="format-toggle" id="formatToggle">
    <button data-fmt="storage" class="active">Storage Format</button>
    <button data-fmt="wiki" title="Legacy editor / Data Center only — deprecated in Confluence Cloud">Wiki Markup (legacy)</button>
  </div>
  <div style="flex:1"></div>
  <button class="btn btn-secondary" id="btnClear">Clear</button>
  <button class="btn btn-secondary" id="btnDownload">Download</button>
</div>

<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-tab="edit">Markdown</button>
  <button class="tab-btn" data-tab="output">Confluence</button>
</div>

<div class="editor-wrap">
  <div class="pane" id="editPane">
    <div class="pane-label">Markdown</div>
    <textarea id="editor" spellcheck="false" placeholder="# Hello Confluence

Paste or type Markdown here. The converted output appears on the right — copy it and paste into the Confluence editor's source view.

## Supported
- **Bold**, *italic*, ~~strikethrough~~, `inline code`
- Headings, lists, links, images
- Code blocks with language hints
- Tables
- Task lists
- GitHub alerts → panels:

> [!NOTE]
> Renders as a Confluence info panel.

> [!WARNING]
> Renders as a warning panel."></textarea>
  </div>
  <div class="pane hidden-mobile" id="outputPane">
    <div class="pane-label">
      <span id="outputLabel">Confluence Storage Format</span>
      <button class="copy-btn" id="btnCopy">Copy</button>
    </div>
    <textarea id="output" spellcheck="false" readonly></textarea>
  </div>
</div>

<div class="footer">100% client-side · no uploads · no servers</div>

<div class="drop-overlay" id="dropOverlay">
  <div class="drop-overlay-inner">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
    </svg>
    <p>Drop your .md file</p>
    <span>Markdown or plain text</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const editor = $('editor'), output = $('output');
  const fileInput = $('fileInput'), fileName = $('fileName');
  const btnClear = $('btnClear'), btnCopy = $('btnCopy'), btnDownload = $('btnDownload');
  const dropOverlay = $('dropOverlay');
  const toastEl = $('toast');
  const outputLabel = $('outputLabel');
  const formatToggle = $('formatToggle');

  let currentFormat = 'storage';

  /* ── Escape helpers ── */
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function escAttr(s) { return escHtml(s); }
  function escCdata(s) { return String(s).replace(/]]>/g, ']]]]><![CDATA[>'); }

  /* ── GitHub-style alert detection in blockquotes ── */
  const ALERT_MACROS = {
    note: 'info',
    tip: 'tip',
    important: 'note',
    warning: 'warning',
    caution: 'warning',
  };

  function extractAlert(blockquote) {
    const first = blockquote.tokens && blockquote.tokens[0];
    if (!first || first.type !== 'paragraph' || !first.tokens || !first.tokens.length) return null;
    const head = first.tokens[0];
    if (!head || head.type !== 'text') return null;
    const m = head.text.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*\r?\n?/);
    if (!m) return null;
    const kind = m[1].toLowerCase();
    const rest = head.text.slice(m[0].length);
    const newHead = Object.assign({}, head, { text: rest, raw: rest });
    const newFirstTokens = rest === ''
      ? first.tokens.slice(1)
      : [newHead, ...first.tokens.slice(1)];
    const inner = newFirstTokens.length === 0
      ? blockquote.tokens.slice(1)
      : [Object.assign({}, first, { tokens: newFirstTokens }), ...blockquote.tokens.slice(1)];
    return { kind, inner };
  }

  /* ── Storage Format renderer ── */
  function storageInline(tokens) {
    if (!tokens) return '';
    return tokens.map(t => {
      switch (t.type) {
        case 'text':
          if (t.tokens) return storageInline(t.tokens);
          return escHtml(t.text);
        case 'escape': return escHtml(t.text);
        case 'strong': return '<strong>' + storageInline(t.tokens) + '</strong>';
        case 'em': return '<em>' + storageInline(t.tokens) + '</em>';
        case 'del': return '<span style="text-decoration: line-through;">' + storageInline(t.tokens) + '</span>';
        case 'codespan': return '<code>' + escHtml(t.text) + '</code>';
        case 'link':
          return '<a href="' + escAttr(t.href) + '"'
            + (t.title ? ' title="' + escAttr(t.title) + '"' : '')
            + '>' + storageInline(t.tokens) + '</a>';
        case 'image':
          return '<ac:image'
            + (t.text ? ' ac:alt="' + escAttr(t.text) + '"' : '')
            + '><ri:url ri:value="' + escAttr(t.href) + '"/></ac:image>';
        case 'br': return '<br/>';
        case 'html': return t.text;
        default: return escHtml(t.raw || '');
      }
    }).join('');
  }

  let taskIdCounter = 0;

  function storageList(list) {
    const allTasks = list.items.length > 0 && list.items.every(i => i.task);
    if (allTasks) {
      return '<ac:task-list>' + list.items.map(i => {
        const status = i.checked ? 'complete' : 'incomplete';
        const body = storageListItemBody(i);
        const id = ++taskIdCounter;
        return '<ac:task><ac:task-id>' + id + '</ac:task-id>'
          + '<ac:task-status>' + status + '</ac:task-status>'
          + '<ac:task-body>' + body + '</ac:task-body></ac:task>';
      }).join('') + '</ac:task-list>';
    }
    const tag = list.ordered ? 'ol' : 'ul';
    return '<' + tag + '>' + list.items.map(i =>
      '<li>' + storageListItemBody(i) + '</li>'
    ).join('') + '</' + tag + '>';
  }

  function storageListItemBody(item) {
    // Unwrap a single loose paragraph so list items stay compact
    const parts = [];
    for (const t of item.tokens) {
      if (t.type === 'text' && t.tokens) {
        parts.push(storageInline(t.tokens));
      } else if (t.type === 'paragraph' && !item.loose && item.tokens.length === 1) {
        parts.push(storageInline(t.tokens));
      } else {
        parts.push(storageBlock([t]));
      }
    }
    return parts.join('');
  }

  function storageBlock(tokens) {
    const out = [];
    for (const t of tokens) {
      switch (t.type) {
        case 'heading':
          out.push('<h' + t.depth + '>' + storageInline(t.tokens) + '</h' + t.depth + '>');
          break;
        case 'paragraph':
          out.push('<p>' + storageInline(t.tokens) + '</p>');
          break;
        case 'blockquote': {
          const alert = extractAlert(t);
          if (alert) {
            const macro = ALERT_MACROS[alert.kind];
            out.push('<ac:structured-macro ac:name="' + macro + '" ac:schema-version="1"><ac:rich-text-body>'
              + storageBlock(alert.inner) + '</ac:rich-text-body></ac:structured-macro>');
          } else {
            out.push('<blockquote>' + storageBlock(t.tokens) + '</blockquote>');
          }
          break;
        }
        case 'list':
          out.push(storageList(t));
          break;
        case 'code': {
          const lang = (t.lang || '').trim().split(/\s+/)[0];
          out.push('<ac:structured-macro ac:name="code" ac:schema-version="1">'
            + (lang ? '<ac:parameter ac:name="language">' + escHtml(lang) + '</ac:parameter>' : '')
            + '<ac:plain-text-body><![CDATA[' + escCdata(t.text) + ']]></ac:plain-text-body>'
            + '</ac:structured-macro>');
          break;
        }
        case 'table': {
          const header = '<tr>' + t.header.map(h =>
            '<th>' + storageInline(h.tokens) + '</th>'
          ).join('') + '</tr>';
          const rows = t.rows.map(r =>
            '<tr>' + r.map(c => '<td>' + storageInline(c.tokens) + '</td>').join('') + '</tr>'
          ).join('');
          out.push('<table><tbody>' + header + rows + '</tbody></table>');
          break;
        }
        case 'hr':
          out.push('<hr/>');
          break;
        case 'space':
          break;
        case 'html':
          out.push(t.text);
          break;
        default:
          if (t.tokens) out.push(storageBlock(t.tokens));
      }
    }
    return out.join('\n');
  }

  /* ── Wiki Markup renderer ── */
  function wikiInline(tokens) {
    if (!tokens) return '';
    return tokens.map(t => {
      switch (t.type) {
        case 'text':
          if (t.tokens) return wikiInline(t.tokens);
          return t.text;
        case 'escape': return t.text;
        case 'strong': return '*' + wikiInline(t.tokens) + '*';
        case 'em': return '_' + wikiInline(t.tokens) + '_';
        case 'del': return '-' + wikiInline(t.tokens) + '-';
        case 'codespan': return '{{' + t.text + '}}';
        case 'link': {
          const text = wikiInline(t.tokens);
          if (!text || text === t.href) return '[' + t.href + ']';
          return '[' + text + '|' + t.href + ']';
        }
        case 'image':
          return '!' + t.href + '!';
        case 'br': return '\\\\';
        case 'html': return t.text;
        default: return t.raw || '';
      }
    }).join('');
  }

  function wikiList(list, depth) {
    const marker = (list.ordered ? '#' : '*').repeat(depth);
    const lines = [];
    for (const item of list.items) {
      const inlineParts = [];
      const nested = [];
      for (const t of item.tokens) {
        if (t.type === 'list') {
          nested.push(wikiList(t, depth + 1));
        } else if (t.type === 'text' && t.tokens) {
          inlineParts.push(wikiInline(t.tokens));
        } else if (t.type === 'paragraph') {
          inlineParts.push(wikiInline(t.tokens));
        } else if (t.type === 'code') {
          nested.push('{code' + (t.lang ? ':' + t.lang : '') + '}\n' + t.text + '\n{code}');
        } else if (t.type === 'space') {
          // skip
        } else {
          inlineParts.push(wikiBlock([t]));
        }
      }
      let prefix = marker + ' ';
      if (item.task) prefix = marker + ' ' + (item.checked ? '[x]' : '[ ]') + ' ';
      lines.push(prefix + inlineParts.join(' '));
      for (const n of nested) lines.push(n);
    }
    return lines.join('\n');
  }

  function wikiBlock(tokens) {
    const out = [];
    for (const t of tokens) {
      switch (t.type) {
        case 'heading':
          out.push('h' + t.depth + '. ' + wikiInline(t.tokens));
          break;
        case 'paragraph':
          out.push(wikiInline(t.tokens));
          break;
        case 'blockquote': {
          const alert = extractAlert(t);
          if (alert) {
            const macro = ALERT_MACROS[alert.kind];
            out.push('{' + macro + '}\n' + wikiBlock(alert.inner) + '\n{' + macro + '}');
          } else {
            out.push('{quote}\n' + wikiBlock(t.tokens) + '\n{quote}');
          }
          break;
        }
        case 'list':
          out.push(wikiList(t, 1));
          break;
        case 'code': {
          const lang = (t.lang || '').trim().split(/\s+/)[0];
          out.push('{code' + (lang ? ':' + lang : '') + '}\n' + t.text + '\n{code}');
          break;
        }
        case 'table': {
          const header = '||' + t.header.map(h => wikiInline(h.tokens) || ' ').join('||') + '||';
          const rows = t.rows.map(r =>
            '|' + r.map(c => wikiInline(c.tokens) || ' ').join('|') + '|'
          );
          out.push([header, ...rows].join('\n'));
          break;
        }
        case 'hr':
          out.push('----');
          break;
        case 'space':
          break;
        case 'html':
          out.push(t.text);
          break;
        default:
          if (t.tokens) out.push(wikiBlock(t.tokens));
      }
    }
    return out.filter(s => s !== '').join('\n\n');
  }

  /* ── Conversion driver ── */
  function convert() {
    const md = editor.value;
    if (!md) { output.value = ''; return; }
    try {
      const tokens = marked.lexer(md, { gfm: true });
      taskIdCounter = 0;
      output.value = currentFormat === 'wiki' ? wikiBlock(tokens) : storageBlock(tokens);
    } catch (e) {
      output.value = '// Conversion error: ' + (e.message || e);
    }
  }

  let renderTimeout;
  function scheduleConvert() {
    clearTimeout(renderTimeout);
    renderTimeout = setTimeout(convert, 120);
  }
  editor.addEventListener('input', scheduleConvert);

  /* ── Format toggle ── */
  formatToggle.addEventListener('click', e => {
    const btn = e.target.closest('button[data-fmt]');
    if (!btn) return;
    currentFormat = btn.dataset.fmt;
    formatToggle.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
    outputLabel.textContent = currentFormat === 'wiki'
      ? 'Confluence Wiki Markup (legacy / Data Center)'
      : 'Confluence Storage Format';
    convert();
  });

  /* ── Tab support in editor ── */
  editor.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, end = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(end);
      editor.selectionStart = editor.selectionEnd = s + 2;
      scheduleConvert();
    }
  });

  /* ── Mobile tabs ── */
  const tabBtns = document.querySelectorAll('.tab-btn');
  const editPane = $('editPane'), outputPane = $('outputPane');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.tab === 'edit') {
        editPane.classList.remove('hidden-mobile');
        outputPane.classList.add('hidden-mobile');
      } else {
        outputPane.classList.remove('hidden-mobile');
        editPane.classList.add('hidden-mobile');
        convert();
      }
    });
  });

  /* ── File input ── */
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) loadFile(fileInput.files[0]);
    fileInput.value = '';
  });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      editor.value = reader.result;
      fileName.textContent = file.name;
      convert();
      toast('Loaded ' + file.name, 'success');
    };
    reader.onerror = () => toast('Could not read file', 'error');
    reader.readAsText(file);
  }

  /* ── Drag & drop ── */
  let dragCounter = 0;
  document.addEventListener('dragenter', e => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('active');
  });
  document.addEventListener('dragleave', e => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('active');
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });

  /* ── Clear ── */
  btnClear.addEventListener('click', () => {
    editor.value = '';
    output.value = '';
    fileName.textContent = '';
  });

  /* ── Copy ── */
  btnCopy.addEventListener('click', async () => {
    if (!output.value) { toast('Nothing to copy', 'error'); return; }
    try {
      await navigator.clipboard.writeText(output.value);
      btnCopy.textContent = 'Copied!';
      btnCopy.classList.add('copied');
      setTimeout(() => {
        btnCopy.textContent = 'Copy';
        btnCopy.classList.remove('copied');
      }, 1500);
    } catch {
      output.select();
      document.execCommand('copy');
      toast('Copied', 'success');
    }
  });

  /* ── Download ── */
  btnDownload.addEventListener('click', () => {
    if (!output.value) { toast('Nothing to download', 'error'); return; }
    const ext = currentFormat === 'wiki' ? 'wiki.txt' : 'storage.xml';
    const base = (fileName.textContent || 'document').replace(/\.\w+$/, '');
    const blob = new Blob([output.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = base + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  /* ── Toast ── */
  function toast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + (type || '') + ' show';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  convert();
})();
</script>
</body>
</html>
