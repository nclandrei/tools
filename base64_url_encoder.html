<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 / URL Encoder-Decoder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a1e;
    --surface: #24242a;
    --border: #35353d;
    --text: #e0e0e4;
    --text-dim: #8888a0;
    --accent: #e8c44a;
    --accent-dim: #e8c44a22;
    --green: #5caa6c;
    --red: #c45c5c;
    --blue: #5c8ac4;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 2rem;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }

  textarea {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea::placeholder {
    color: var(--text-dim);
  }

  .mode-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .mode-tab {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.55rem 1rem;
    border: none;
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .mode-tab + .mode-tab {
    border-left: 1px solid var(--border);
  }

  .mode-tab.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .mode-tab:hover:not(.active) {
    color: var(--text);
  }

  .section {
    margin-bottom: 1.25rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }

  .section-header label {
    margin-bottom: 0;
  }

  .btn-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.55rem 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .output-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 3rem;
    position: relative;
  }

  .output-box .copy-btn {
    position: absolute;
    top: 0.4rem;
    right: 0.4rem;
    font-size: 0.7rem;
    padding: 0.25rem 0.5rem;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .output-box:hover .copy-btn {
    opacity: 1;
  }

  .error-box {
    background: #c45c5c22;
    border: 1px solid #c45c5c55;
    border-radius: 6px;
    padding: 0.75rem;
    font-size: 0.82rem;
    color: var(--red);
    display: none;
    margin-bottom: 1.25rem;
  }

  .info-bar {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .info-chip {
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .back-link {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--text-dim);
    text-decoration: none;
    margin-bottom: 1.5rem;
  }

  .back-link:hover { color: var(--accent); }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    text-align: center;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 1.25rem;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }

  .drop-zone:hover,
  .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .drop-zone input {
    display: none;
  }

  .file-info {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 1.25rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .file-info span {
    color: var(--accent);
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .option-row label {
    margin-bottom: 0;
    font-size: 0.78rem;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .option-row input[type="checkbox"] {
    accent-color: var(--accent);
  }
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">&larr; all tools</a>
  <h1>Base64 / URL Encoder-Decoder</h1>
  <p class="subtitle">Encode and decode Base64 or URL-encoded strings. Supports file upload for binary data.</p>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="base64">Base64</button>
    <button class="mode-tab" data-mode="url">URL Encode</button>
  </div>

  <!-- Text input -->
  <div class="section">
    <label for="input-text">Input</label>
    <textarea id="input-text" rows="5" placeholder="Paste text here..." spellcheck="false"></textarea>
  </div>

  <!-- File drop zone -->
  <div class="drop-zone" id="drop-zone">
    Drop a file here or click to select
    <input type="file" id="file-input">
  </div>
  <div class="file-info" id="file-info" style="display:none"></div>

  <!-- Options -->
  <div class="option-row" id="base64-options">
    <label><input type="checkbox" id="url-safe-b64"> URL-safe Base64</label>
    <label><input type="checkbox" id="no-padding"> Omit padding</label>
  </div>

  <div class="btn-row">
    <button class="btn" id="encode-btn">Encode</button>
    <button class="btn" id="decode-btn">Decode</button>
    <button class="btn" id="clear-btn">Clear</button>
    <button class="btn" id="swap-btn">Swap &#8597;</button>
  </div>

  <div id="error" class="error-box"></div>

  <div id="output-section" style="display:none">
    <div class="info-bar" id="info-bar"></div>

    <div class="section">
      <div class="section-header">
        <label id="output-label">Output</label>
      </div>
      <div class="output-box" id="output-box">
        <button class="btn copy-btn" id="copy-btn">Copy</button>
        <span id="output-text"></span>
      </div>
    </div>

    <div class="section" id="download-section" style="display:none">
      <button class="btn" id="download-btn">Download decoded file</button>
    </div>
  </div>
</div>

<script>
  let currentMode = 'base64';
  let fileBytes = null;
  let fileName = null;
  let decodedBlob = null;

  const inputText = document.getElementById('input-text');
  const fileInput = document.getElementById('file-input');
  const dropZone = document.getElementById('drop-zone');
  const fileInfo = document.getElementById('file-info');
  const errorBox = document.getElementById('error');
  const outputSection = document.getElementById('output-section');
  const outputText = document.getElementById('output-text');
  const outputLabel = document.getElementById('output-label');
  const infoBar = document.getElementById('info-bar');
  const downloadSection = document.getElementById('download-section');
  const base64Options = document.getElementById('base64-options');

  // Mode tabs
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelector('.mode-tab.active').classList.remove('active');
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      base64Options.style.display = currentMode === 'base64' ? '' : 'none';
      clearOutput();
    });
  });

  // File handling
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    fileName = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      fileBytes = new Uint8Array(reader.result);
      fileInfo.innerHTML = `File: <span>${esc(fileName)}</span> (${formatSize(fileBytes.length)})`;
      fileInfo.style.display = '';
      inputText.value = '';
      inputText.placeholder = `File loaded: ${fileName}`;
    };
    reader.readAsArrayBuffer(file);
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Encode
  document.getElementById('encode-btn').addEventListener('click', () => {
    clearOutput();
    const urlSafe = document.getElementById('url-safe-b64').checked;
    const noPad = document.getElementById('no-padding').checked;

    try {
      let result;
      if (currentMode === 'base64') {
        let raw;
        if (fileBytes) {
          raw = fileBytes;
        } else {
          const text = inputText.value;
          if (!text) return;
          raw = new TextEncoder().encode(text);
        }
        // Convert Uint8Array to base64
        let b64 = uint8ToBase64(raw);
        if (urlSafe) {
          b64 = b64.replace(/\+/g, '-').replace(/\//g, '_');
        }
        if (noPad) {
          b64 = b64.replace(/=+$/, '');
        }
        result = b64;
        showOutput(result, 'Encoded (Base64)', raw.length, result.length);
      } else {
        const text = fileBytes ? new TextDecoder().decode(fileBytes) : inputText.value;
        if (!text) return;
        result = encodeURIComponent(text);
        showOutput(result, 'Encoded (URL)', new TextEncoder().encode(text).length, new TextEncoder().encode(result).length);
      }
    } catch (e) {
      showError(e.message);
    }
  });

  // Decode
  document.getElementById('decode-btn').addEventListener('click', () => {
    clearOutput();

    try {
      let result;
      if (currentMode === 'base64') {
        const text = fileBytes ? uint8ToBase64(fileBytes) : inputText.value.trim();
        if (!text) return;
        // Normalize URL-safe base64
        let b64 = text.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bytes = base64ToUint8(b64);
        // Try to decode as text
        try {
          const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
          result = decoded;
          showOutput(result, 'Decoded (Text)', text.length, bytes.length);
        } catch {
          // Binary data — offer download
          const mimeType = guessMime(bytes);
          decodedBlob = new Blob([bytes], { type: mimeType });
          showOutput(`[Binary data: ${formatSize(bytes.length)}, ${mimeType}]`, 'Decoded (Binary)', text.length, bytes.length);
          downloadSection.style.display = '';
        }
      } else {
        const text = fileBytes ? new TextDecoder().decode(fileBytes) : inputText.value;
        if (!text) return;
        result = decodeURIComponent(text);
        showOutput(result, 'Decoded (URL)', new TextEncoder().encode(text).length, new TextEncoder().encode(result).length);
      }
    } catch (e) {
      showError('Decode failed: ' + e.message);
    }
  });

  // Clear
  document.getElementById('clear-btn').addEventListener('click', () => {
    inputText.value = '';
    inputText.placeholder = 'Paste text here...';
    fileBytes = null;
    fileName = null;
    fileInfo.style.display = 'none';
    fileInput.value = '';
    clearOutput();
  });

  // Swap
  document.getElementById('swap-btn').addEventListener('click', () => {
    const out = outputText.textContent;
    if (!out || out.startsWith('[Binary')) return;
    inputText.value = out;
    fileBytes = null;
    fileName = null;
    fileInfo.style.display = 'none';
    clearOutput();
  });

  // Copy
  document.getElementById('copy-btn').addEventListener('click', () => {
    const text = outputText.textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1200);
    });
  });

  // Download decoded binary
  document.getElementById('download-btn').addEventListener('click', () => {
    if (!decodedBlob) return;
    const url = URL.createObjectURL(decodedBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'decoded_file';
    a.click();
    URL.revokeObjectURL(url);
  });

  function showOutput(text, label, inputSize, outputSize) {
    outputSection.style.display = '';
    outputText.textContent = text;
    outputLabel.textContent = label;
    infoBar.innerHTML = '';
    infoBar.innerHTML +=
      `<span class="info-chip">Input: ${formatSize(inputSize)}</span>` +
      `<span class="info-chip">Output: ${formatSize(outputSize)}</span>`;
    if (inputSize > 0 && currentMode === 'base64') {
      const ratio = (outputSize / inputSize).toFixed(2);
      infoBar.innerHTML += `<span class="info-chip">Ratio: ${ratio}x</span>`;
    }
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = '';
  }

  function clearOutput() {
    outputSection.style.display = 'none';
    errorBox.style.display = 'none';
    downloadSection.style.display = 'none';
    decodedBlob = null;
  }

  // Base64 helpers that work with binary data
  function uint8ToBase64(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  function base64ToUint8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  function guessMime(bytes) {
    if (bytes[0] === 0xFF && bytes[1] === 0xD8) return 'image/jpeg';
    if (bytes[0] === 0x89 && bytes[1] === 0x50) return 'image/png';
    if (bytes[0] === 0x47 && bytes[1] === 0x49) return 'image/gif';
    if (bytes[0] === 0x25 && bytes[1] === 0x50) return 'application/pdf';
    if (bytes[0] === 0x50 && bytes[1] === 0x4B) return 'application/zip';
    return 'application/octet-stream';
  }

  // Auto-clear file when user types
  inputText.addEventListener('input', () => {
    if (fileBytes) {
      fileBytes = null;
      fileName = null;
      fileInfo.style.display = 'none';
      fileInput.value = '';
      inputText.placeholder = 'Paste text here...';
    }
  });
</script>
</body>
</html>
