<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Background Remover</title>
  <script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .container { max-width: 900px; }

    header { margin-bottom: 2.5rem; animation: fadeUp .4s ease; }
    header h1 { font-size: 1.75rem; }
    .subtitle { color: var(--text-muted); font-size: .95rem; }

    .drop-zone {
      padding: 3rem 2rem;
      position: relative;
      animation: fadeUp .4s ease .05s both;
    }
    .drop-zone.has-image { display: none; }
    .drop-icon { font-size: 2rem; margin-bottom: .75rem; }
    .drop-text { color: var(--text-muted); font-size: .95rem; }
    .drop-text strong { color: var(--text); }
    .drop-hint { color: var(--text-muted); font-size: .8rem; margin-top: .5rem; }
    .drop-zone input { display: none; }

    .status-bar {
      display: none;
      align-items: center;
      gap: .75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      animation: fadeUp .3s ease;
    }
    .status-bar.visible { display: flex; }
    .status-bar .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }
    .status-bar .status-text { font-size: .9rem; color: var(--text-muted); }
    .status-bar .status-text strong { color: var(--text); }
    .status-bar.error { border-color: var(--red); }
    .status-bar.error .status-text { color: var(--red); }

    .progress-bar {
      display: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-bar.visible { display: block; }
    .progress-bar .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .3s ease;
      width: 0%;
    }

    .result-area {
      display: none;
      animation: fadeUp .4s ease;
    }
    .result-area.visible { display: block; }

    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 600px) {
      .comparison { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .panel-label {
      font-size: .8rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .panel-body {
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    .panel-body.checkerboard {
      background-image:
        linear-gradient(45deg, var(--surface-alt) 25%, transparent 25%),
        linear-gradient(-45deg, var(--surface-alt) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--surface-alt) 75%),
        linear-gradient(-45deg, transparent 75%, var(--surface-alt) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }
    .panel-body img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
    }

    .actions {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.25rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all .15s ease;
    }
    .btn:hover { background: var(--surface-alt); border-color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .bg-options {
      display: flex;
      gap: .5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .bg-options label {
      font-size: .85rem;
      color: var(--text-muted);
      margin-right: .25rem;
    }
    .bg-opt {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: border-color .15s ease;
    }
    .bg-opt:hover, .bg-opt.active { border-color: var(--accent); }
    .bg-opt.transparent {
      background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0;
    }
    .bg-opt.white { background: #fff; }
    .bg-opt.black { background: #000; }
    .bg-opt.custom-color {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--red), var(--accent), var(--green));
    }
    .bg-opt.custom-color input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Background Remover</h1>
      <a href="/">← all tools</a>
      <p class="subtitle">Remove image backgrounds locally using AI. Nothing leaves your browser.</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">+</div>
      <div class="drop-text"><strong>Drop an image</strong> or click to browse</div>
      <div class="drop-hint">PNG, JPG, WebP — up to 20 MB</div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
    </div>

    <div class="status-bar" id="statusBar">
      <div class="spinner" id="statusSpinner"></div>
      <div class="status-text" id="statusText">Loading model...</div>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="result-area" id="resultArea">
      <div class="bg-options">
        <label>Background:</label>
        <div class="bg-opt transparent active" data-bg="transparent" title="Transparent"></div>
        <div class="bg-opt white" data-bg="white" title="White"></div>
        <div class="bg-opt black" data-bg="black" title="Black"></div>
        <div class="bg-opt custom-color" title="Custom color">
          <input type="color" id="customColor" value="#7c3aed">
        </div>
      </div>
      <div class="comparison">
        <div class="panel">
          <div class="panel-label">Original</div>
          <div class="panel-body">
            <img id="originalImg">
          </div>
        </div>
        <div class="panel">
          <div class="panel-label">Result</div>
          <div class="panel-body checkerboard" id="resultBody">
            <img id="resultImg">
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="downloadBtn">Download PNG</button>
        <button class="btn" id="resetBtn">New Image</button>
      </div>
    </div>
  </div>

  <canvas id="workCanvas" style="display:none"></canvas>

  <script type="module">
    import { AutoModel, AutoProcessor, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.2/dist/transformers.min.js';

    const $ = s => document.querySelector(s);
    const dropZone = $('#dropZone');
    const fileInput = $('#fileInput');
    const statusBar = $('#statusBar');
    const statusText = $('#statusText');
    const statusSpinner = $('#statusSpinner');
    const progressBar = $('#progressBar');
    const progressFill = $('#progressFill');
    const resultArea = $('#resultArea');
    const originalImg = $('#originalImg');
    const resultImg = $('#resultImg');
    const resultBody = $('#resultBody');
    const downloadBtn = $('#downloadBtn');
    const resetBtn = $('#resetBtn');
    const workCanvas = $('#workCanvas');
    const customColorInput = $('#customColor');

    let model = null;
    let processor = null;
    let currentMaskData = null;
    let currentOriginalData = null;
    let selectedBg = 'transparent';
    let currentResultBlobUrl = null;

    // --- File handling ---

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleFile(file);
    });

    // Paste support
    document.addEventListener('paste', e => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          handleFile(item.getAsFile());
          return;
        }
      }
    });

    async function handleFile(file) {
      if (file.size > 20 * 1024 * 1024) {
        showError('File too large. Max 20 MB.');
        return;
      }

      dropZone.classList.add('has-image');
      resultArea.classList.remove('visible');
      showStatus('Loading model...');
      showProgress(0);

      try {
        await ensureModel();
        showStatus('Processing image...');
        showProgress(50);

        const imgUrl = URL.createObjectURL(file);
        originalImg.src = imgUrl;

        const image = await RawImage.fromURL(imgUrl);
        const { pixel_values } = await processor(image);
        const { output } = await model({ input: pixel_values });

        // output is [1, 1, H, W] mask
        const maskData = output.data;
        const maskH = output.dims[2];
        const maskW = output.dims[3];

        // Resize mask to match original image
        const origW = image.width;
        const origH = image.height;

        workCanvas.width = origW;
        workCanvas.height = origH;
        const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

        // Draw original
        ctx.drawImage(await createImageBitmap(file), 0, 0);
        currentOriginalData = ctx.getImageData(0, 0, origW, origH);

        // Resample mask to original size
        currentMaskData = new Float32Array(origW * origH);
        for (let y = 0; y < origH; y++) {
          for (let x = 0; x < origW; x++) {
            const srcX = Math.min(Math.floor(x * maskW / origW), maskW - 1);
            const srcY = Math.min(Math.floor(y * maskH / origH), maskH - 1);
            currentMaskData[y * origW + x] = maskData[srcY * maskW + srcX];
          }
        }

        renderResult();
        showProgress(100);
        hideStatus();
        resultArea.classList.add('visible');
      } catch (err) {
        console.error(err);
        showError('Processing failed: ' + err.message);
      }
    }

    async function ensureModel() {
      if (model) return;

      const modelId = 'briaai/RMBG-1.4';

      showStatus('Downloading model (first time only, ~170 MB)...');
      showProgress(10);

      model = await AutoModel.from_pretrained(modelId, {
        device: 'webgpu' in navigator.gpu ? undefined : 'wasm',
        dtype: 'fp32',
        progress_callback: (p) => {
          if (p.status === 'progress' && p.total) {
            const pct = 10 + (p.loaded / p.total) * 35;
            showProgress(pct);
          }
        },
      });

      processor = await AutoProcessor.from_pretrained(modelId, {
        progress_callback: (p) => {
          if (p.status === 'progress' && p.total) {
            const pct = 45 + (p.loaded / p.total) * 5;
            showProgress(pct);
          }
        },
      });
    }

    async function renderResult() {
      if (!currentOriginalData || !currentMaskData) return;

      const origW = currentOriginalData.width;
      const origH = currentOriginalData.height;
      const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

      workCanvas.width = origW;
      workCanvas.height = origH;

      // Draw background
      if (selectedBg === 'transparent') {
        ctx.clearRect(0, 0, origW, origH);
      } else {
        ctx.fillStyle = selectedBg;
        ctx.fillRect(0, 0, origW, origH);
      }

      // Apply mask
      const output = ctx.getImageData(0, 0, origW, origH);
      const src = currentOriginalData.data;
      const dst = output.data;

      for (let i = 0; i < origW * origH; i++) {
        const alpha = Math.round(currentMaskData[i] * 255);
        const pi = i * 4;
        if (selectedBg === 'transparent') {
          dst[pi] = src[pi];
          dst[pi + 1] = src[pi + 1];
          dst[pi + 2] = src[pi + 2];
          dst[pi + 3] = alpha;
        } else {
          const a = alpha / 255;
          dst[pi] = Math.round(src[pi] * a + dst[pi] * (1 - a));
          dst[pi + 1] = Math.round(src[pi + 1] * a + dst[pi + 1] * (1 - a));
          dst[pi + 2] = Math.round(src[pi + 2] * a + dst[pi + 2] * (1 - a));
          dst[pi + 3] = 255;
        }
      }

      ctx.putImageData(output, 0, 0);

      // Use blob URL instead of data URL to avoid Safari iOS navigating to data: URI
      if (currentResultBlobUrl) URL.revokeObjectURL(currentResultBlobUrl);
      const blob = await new Promise(r => workCanvas.toBlob(r, 'image/png'));
      currentResultBlobUrl = URL.createObjectURL(blob);
      resultImg.src = currentResultBlobUrl;

      // Show/hide checkerboard
      if (selectedBg === 'transparent') {
        resultBody.classList.add('checkerboard');
      } else {
        resultBody.classList.remove('checkerboard');
      }
    }

    // --- Background options ---

    document.querySelectorAll('.bg-opt').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.bg-opt').forEach(o => o.classList.remove('active'));
        el.classList.add('active');
        if (el.dataset.bg) {
          selectedBg = el.dataset.bg;
        }
        renderResult();
      });
    });

    customColorInput.addEventListener('input', e => {
      selectedBg = e.target.value;
      document.querySelectorAll('.bg-opt').forEach(o => o.classList.remove('active'));
      customColorInput.closest('.bg-opt').classList.add('active');
      renderResult();
    });

    // --- Actions ---

    downloadBtn.addEventListener('click', async () => {
      // Re-export from canvas as blob to ensure fresh blob URL for download
      // Using blob URLs instead of data URLs prevents Safari iOS from navigating to data: URI
      const blob = await new Promise(r => workCanvas.toBlob(r, 'image/png'));
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'background-removed.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    resetBtn.addEventListener('click', () => {
      dropZone.classList.remove('has-image');
      resultArea.classList.remove('visible');
      hideStatus();
      hideProgress();
      fileInput.value = '';
      currentMaskData = null;
      currentOriginalData = null;
      if (currentResultBlobUrl) {
        URL.revokeObjectURL(currentResultBlobUrl);
        currentResultBlobUrl = null;
      }
    });

    // --- UI helpers ---

    function showStatus(msg) {
      statusBar.classList.remove('error');
      statusBar.classList.add('visible');
      statusSpinner.style.display = '';
      statusText.innerHTML = msg;
    }

    function showError(msg) {
      statusBar.classList.add('visible', 'error');
      statusSpinner.style.display = 'none';
      statusText.innerHTML = msg;
    }

    function hideStatus() {
      statusBar.classList.remove('visible');
    }

    function showProgress(pct) {
      progressBar.classList.add('visible');
      progressFill.style.width = Math.min(100, pct) + '%';
    }

    function hideProgress() {
      progressBar.classList.remove('visible');
      progressFill.style.width = '0%';
    }
  </script>
</body>
</html>
