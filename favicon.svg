<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Pivot point at bottom-center area -->
  <!-- Blades fan out from pivot (512, 680) upward -->

  <!-- Blade 1: far left — wide flat blade -->
  <g transform="rotate(-50, 512, 680)">
    <rect x="480" y="220" width="64" height="460" rx="32" ry="32" fill="white" opacity="0.55"/>
  </g>

  <!-- Blade 2: left — narrow blade -->
  <g transform="rotate(-22, 512, 680)">
    <rect x="488" y="180" width="48" height="500" rx="24" ry="24" fill="white" opacity="0.75"/>
  </g>

  <!-- Blade 3: center — tallest main blade -->
  <g transform="rotate(6, 512, 680)">
    <rect x="484" y="150" width="56" height="530" rx="28" ry="28" fill="white" opacity="1"/>
  </g>

  <!-- Blade 4: right — medium blade -->
  <g transform="rotate(34, 512, 680)">
    <rect x="490" y="200" width="44" height="480" rx="22" ry="22" fill="white" opacity="0.75"/>
  </g>

  <!-- Blade 5: far right — short stubby tool -->
  <g transform="rotate(58, 512, 680)">
    <rect x="492" y="280" width="40" height="400" rx="20" ry="20" fill="white" opacity="0.55"/>
  </g>

  <!-- Pivot circle -->
  <circle cx="512" cy="680" r="52" fill="#e9d5ff"/>
  <circle cx="512" cy="680" r="28" fill="#a78bfa"/>
  <circle cx="512" cy="680" r="12" fill="#6d28d9"/>
</svg>
