<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .container { max-width: 520px; }

  .timer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2.25rem 1.5rem 2rem;
    text-align: center;
    margin-bottom: 1.25rem;
    transition: border-color 0.2s, background 0.2s;
  }
  .timer-card.focus { border-color: var(--accent); background: var(--accent-dim); }
  .timer-card.short { border-color: var(--green); background: var(--green-dim); }
  .timer-card.long  { border-color: var(--blue); background: var(--blue-dim); }

  .mode-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }
  .timer-card.focus .mode-label { color: var(--accent); }
  .timer-card.short .mode-label { color: var(--green); }
  .timer-card.long  .mode-label { color: var(--blue); }

  .timer-display {
    font-size: 4.2rem;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }

  .session-line {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .session-line strong { color: var(--text); }

  .controls {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .controls .btn {
    padding: 0.7rem 1.5rem;
    font-size: 0.92rem;
    min-width: 92px;
  }

  .settings-toggle {
    display: flex;
    justify-content: center;
    margin-top: 0.4rem;
  }
  .settings-toggle .btn {
    padding: 0.45rem 0.9rem;
    font-size: 0.78rem;
  }

  .settings {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-top: 0.9rem;
  }
  .settings.open { display: block; }
  .settings h2 {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 0.85rem;
  }
  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem 0.9rem;
    margin-bottom: 1rem;
  }
  .settings-grid .field { display: flex; flex-direction: column; gap: 0.25rem; }
  .settings-grid label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .settings-grid input {
    padding: 0.5rem 0.6rem;
    font-size: 0.92rem;
  }
  .settings-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
  .settings-actions .btn { padding: 0.5rem 1rem; font-size: 0.82rem; }
  @media (max-width: 480px) {
    .settings-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Pomodoro Timer</h1>
    <a href="/">&larr; All tools</a>
  </header>
  <p class="desc">Focus in 25-minute blocks with short and long breaks. State, mode, and settings live entirely in this tab &mdash; nothing is sent anywhere.</p>

  <div id="timer-card" class="timer-card focus">
    <div class="mode-label" id="mode-label">Focus</div>
    <div class="timer-display" id="timer-display">25:00</div>
    <div class="session-line">Completed sessions: <strong id="session-count">0</strong></div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="start-btn">Start</button>
    <button class="btn btn-secondary" id="reset-btn">Reset</button>
    <button class="btn btn-secondary" id="skip-btn">Skip</button>
  </div>

  <div class="settings-toggle">
    <button class="btn btn-secondary" id="settings-btn">Settings</button>
  </div>

  <div class="settings" id="settings-panel">
    <h2>Durations</h2>
    <div class="settings-grid">
      <div class="field">
        <label for="focus-min">Focus (min)</label>
        <input type="number" id="focus-min" min="1" max="180" step="1" value="25">
      </div>
      <div class="field">
        <label for="short-min">Short break (min)</label>
        <input type="number" id="short-min" min="1" max="60" step="1" value="5">
      </div>
      <div class="field">
        <label for="long-min">Long break (min)</label>
        <input type="number" id="long-min" min="1" max="120" step="1" value="15">
      </div>
      <div class="field">
        <label for="cycles-input">Sessions before long break</label>
        <input type="number" id="cycles-input" min="2" max="12" step="1" value="4">
      </div>
    </div>
    <div class="settings-actions">
      <button class="btn btn-secondary" id="settings-cancel">Cancel</button>
      <button class="btn btn-primary" id="settings-save">Save</button>
    </div>
  </div>
</div>

<script>
(() => {
  const SETTINGS_KEY = 'pomodoro-timer-settings';
  const DEFAULTS = { focus: 25, short: 5, long: 15, cycles: 4 };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULTS };
      const obj = JSON.parse(raw);
      return {
        focus:  clampInt(obj.focus,  1, 180, DEFAULTS.focus),
        short:  clampInt(obj.short,  1, 60,  DEFAULTS.short),
        long:   clampInt(obj.long,   1, 120, DEFAULTS.long),
        cycles: clampInt(obj.cycles, 2, 12,  DEFAULTS.cycles),
      };
    } catch (e) { return { ...DEFAULTS }; }
  }
  function clampInt(v, lo, hi, fallback) {
    const n = parseInt(v, 10);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(hi, Math.max(lo, n));
  }
  function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

  let settings = loadSettings();
  const MODES = {
    focus: { label: 'Focus',       klass: 'focus' },
    short: { label: 'Short break', klass: 'short' },
    long:  { label: 'Long break',  klass: 'long' },
  };
  function modeMinutes(m) { return settings[m]; }

  let mode = 'focus';
  let completedFocus = 0;
  let cycleIndex = 0; // focus sessions since last long break
  let durationSec = modeMinutes(mode) * 60;
  let remainingSec = durationSec;
  let running = false;
  let endAt = 0;       // performance.now() ms when the current run will hit 0
  let tickHandle = 0;

  const card = document.getElementById('timer-card');
  const modeLabel = document.getElementById('mode-label');
  const display = document.getElementById('timer-display');
  const sessionCount = document.getElementById('session-count');
  const startBtn = document.getElementById('start-btn');
  const resetBtn = document.getElementById('reset-btn');
  const skipBtn = document.getElementById('skip-btn');
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  const focusInput = document.getElementById('focus-min');
  const shortInput = document.getElementById('short-min');
  const longInput = document.getElementById('long-min');
  const cyclesInput = document.getElementById('cycles-input');
  const settingsSave = document.getElementById('settings-save');
  const settingsCancel = document.getElementById('settings-cancel');

  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  const baseTitle = 'Pomodoro Timer';
  function render() {
    const t = fmt(remainingSec);
    display.textContent = t;
    modeLabel.textContent = MODES[mode].label;
    sessionCount.textContent = String(completedFocus);
    card.classList.remove('focus', 'short', 'long');
    card.classList.add(MODES[mode].klass);
    startBtn.textContent = running ? 'Pause' : 'Start';
    document.title = running ? (t + ' · ' + MODES[mode].label + ' — ' + baseTitle) : baseTitle;
  }

  function setMode(next) {
    mode = next;
    durationSec = modeMinutes(mode) * 60;
    remainingSec = durationSec;
    running = false;
    clearTimeout(tickHandle);
    render();
  }

  function advance(autoStart) {
    // Called when the current session ends (timer hit 0) or on Skip.
    if (mode === 'focus') {
      completedFocus += 1;
      cycleIndex += 1;
      if (cycleIndex >= settings.cycles) {
        cycleIndex = 0;
        setMode('long');
      } else {
        setMode('short');
      }
    } else {
      setMode('focus');
    }
    if (autoStart) start();
  }

  function fillSettingsInputs() {
    focusInput.value = settings.focus;
    shortInput.value = settings.short;
    longInput.value = settings.long;
    cyclesInput.value = settings.cycles;
  }
  function openSettings() {
    fillSettingsInputs();
    settingsPanel.classList.add('open');
  }
  function closeSettings() { settingsPanel.classList.remove('open'); }
  function applySettings() {
    settings = {
      focus:  clampInt(focusInput.value,  1, 180, settings.focus),
      short:  clampInt(shortInput.value,  1, 60,  settings.short),
      long:   clampInt(longInput.value,   1, 120, settings.long),
      cycles: clampInt(cyclesInput.value, 2, 12,  settings.cycles),
    };
    saveSettings(settings);
    fillSettingsInputs();
    // Reset current mode duration so display reflects the new value.
    durationSec = modeMinutes(mode) * 60;
    remainingSec = durationSec;
    running = false;
    clearTimeout(tickHandle);
    closeSettings();
    render();
  }

  function tick() {
    if (!running) return;
    const left = (endAt - performance.now()) / 1000;
    if (left <= 0) {
      remainingSec = 0;
      render();
      playChime();
      advance(true);
      return;
    }
    remainingSec = left;
    render();
    tickHandle = setTimeout(tick, 200);
  }

  let audioCtx = null;
  function playChime() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = audioCtx || new Ctx();
      const now = audioCtx.currentTime;
      // Two-note chime: G5 then C6.
      [{ f: 783.99, t: 0 }, { f: 1046.5, t: 0.18 }].forEach(({ f, t }) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0, now + t);
        gain.gain.linearRampToValueAtTime(0.18, now + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.6);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + t);
        osc.stop(now + t + 0.65);
      });
    } catch (e) { /* audio is best-effort */ }
  }

  function start() {
    if (running) return;
    running = true;
    endAt = performance.now() + remainingSec * 1000;
    render();
    tick();
  }

  function pause() {
    if (!running) return;
    remainingSec = Math.max(0, (endAt - performance.now()) / 1000);
    running = false;
    clearTimeout(tickHandle);
    render();
  }

  function reset() {
    running = false;
    clearTimeout(tickHandle);
    remainingSec = durationSec;
    render();
  }

  startBtn.addEventListener('click', () => { running ? pause() : start(); });
  resetBtn.addEventListener('click', reset);
  skipBtn.addEventListener('click', () => advance(false));
  settingsBtn.addEventListener('click', () => {
    settingsPanel.classList.contains('open') ? closeSettings() : openSettings();
  });
  settingsSave.addEventListener('click', applySettings);
  settingsCancel.addEventListener('click', closeSettings);

  fillSettingsInputs();
  render();
})();
</script>
</body>
</html>
